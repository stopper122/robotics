<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Robot Field Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
/* Layout: app shell. Top bar, block editor on the left, field + readouts on the right. Single light theme on purpose: it matches the light block workspace students already know. */
:root {
  color-scheme: light;
  --bg: #e9ecf1; --panel: #ffffff; --ink: #1c2230; --muted: #5f6878; --line: #d5dae3;
  --accent: #1f6fd1; --accent-ink: #ffffff; --go: #1d9b55; --stop: #d23a2f; --chip: #f1f3f7;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; }
.app { height: 100%; display: flex; flex-direction: column; }
.bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: #1c2230; color: #fff;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar h1 { font-family: var(--display); font-size: 22px; margin: 0 12px 0 0; letter-spacing: .02em; white-space: nowrap; }
.bar h1 b { color: #5aa2ff; }
.bar .sp { flex: 1; }
.btn { font: 600 13px var(--body); border-radius: 6px; padding: 7px 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar .btn { background: #2b3446; color: #fff; border-color: #3b465c; }
.bar .btn:hover { background: #36415a; }
.btn.go { background: var(--go); color: #fff; border-color: var(--go); }
.btn.stop { background: var(--stop); color: #fff; border-color: var(--stop); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 460px); }
#blockly { min-height: 0; min-width: 0; position: relative; }
.side { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; padding: 12px; overflow: auto; min-width: 0; }
.fieldwrap { position: relative; width: 100%; aspect-ratio: 1; max-width: 100%; }
#field { width: 100%; height: 100%; display: block; border-radius: 6px; background: #8a8f98; touch-action: none; }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.controls label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.readouts { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }
.ro { background: var(--chip); border-radius: 6px; padding: 6px 8px; }
.ro .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.ro .v { font-family: var(--mono); font-size: 15px; font-variant-numeric: tabular-nums; }
.leds { display: flex; gap: 10px; flex-wrap: wrap; }
.buildbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--chip); border-radius: 8px; padding: 8px; }
.buildbar .tools { display: flex; flex-wrap: wrap; gap: 4px; }
.buildbar .tools .btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.buildbar label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.buildbar label.full { flex-basis: 100%; flex-direction: column; align-items: stretch; }
.buildbar textarea { font: inherit; font-size: 13px; resize: vertical; padding: 6px; border-radius: 6px; border: 1px solid #c9ced8; }
.led { display: flex; align-items: center; gap: 8px; background: var(--chip); border-radius: 6px; padding: 6px 10px 6px 6px; font-size: 13px; }
.led button { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #c9ced8; background: #f4f5f7; cursor: pointer; box-shadow: inset 0 -3px 0 rgba(0,0,0,.12); }
.led button:active, .led button.down { transform: scale(.94); box-shadow: inset 0 2px 3px rgba(0,0,0,.25); }
.led .hint { font-size: 11px; }
.console { background: #11161f; color: #d6f5d6; font-family: var(--mono); font-size: 12.5px; border-radius: 6px; padding: 8px 10px; min-height: 90px; max-height: 180px; overflow: auto; white-space: pre-wrap; }
.console .warn { color: #ffcf66; }
.console .err { color: #ff8a80; }
h2.sec { font: 600 12px var(--body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 4px 0 0; }
@media (max-width: 860px) {
  .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: 55vh auto; overflow: auto; }
  .side { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
}
/* dialogs */
[hidden] { display: none !important; }
.modal { position: fixed; inset: 0; background: rgba(15, 20, 30, .55); display: flex; align-items: center; justify-content: center; z-index: 50;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dlg { background: var(--panel); border-radius: 12px; width: min(720px, 100%); max-height: 100%; overflow: auto; display: flex; flex-direction: column; }
.dlg header { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1; }
.dlg header h2 { font-family: var(--display); font-size: 24px; margin: 0; flex: 1; }
.dlg .body { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.dlg footer { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding: 12px 18px; border-top: 1px solid var(--line); }
.devgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.dev { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--chip); cursor: pointer; text-align: left; font: inherit; color: inherit; display: flex; flex-direction: column; gap: 4px; min-height: 92px; }
.dev:hover, .dev:focus-visible { border-color: var(--accent); }
.dev .t { font-weight: 600; }
.dev .s { font-size: 12px; color: var(--muted); }
.dev .ic { width: 34px; height: 34px; }
.dev.add { border-style: dashed; background: transparent; align-items: center; justify-content: center; color: var(--accent); font-weight: 600; }
.portmap { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.pm-title { font-weight: 600; font-size: 13px; }
.pm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.pm { display: flex; gap: 8px; align-items: center; background: var(--chip); border-radius: 6px; padding: 5px 8px; font-size: 12.5px; }
.pm b { font-family: var(--mono); background: #1c2230; color: #fff; border-radius: 4px; min-width: 22px; text-align: center; padding: 1px 4px; }
.pm.bad { background: #fde8e6; color: #a52a21; }
.pm.bad i { font-style: normal; font-size: 11px; font-weight: 600; }
.pm.empty { color: var(--muted); background: transparent; border: 1px dashed var(--line); }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px 16px; }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 500; }
.form label.chk { flex-direction: row; align-items: center; gap: 8px; color: var(--ink); font-size: 14px; }
.form input[type=text], .form input[type=number], .form select { font: 14px var(--body); padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); min-width: 0; }
.form .full { grid-column: 1 / -1; }
.hint { font-size: 13px; color: var(--muted); margin: 0; max-width: 70ch; }
.err-text { color: var(--stop); font-size: 13px; }
fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 0; }
legend { font-weight: 600; padding: 0 6px; }
textarea { width: 100%; min-height: 140px; font: 12px var(--mono); border: 1px solid var(--line); border-radius: 6px; padding: 8px; box-sizing: border-box; resize: vertical; }
.pad { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
.padtop { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.padstatus { flex: 1 1 160px; font-size: 12.5px; color: var(--muted); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: #b9c0cc; flex: none; }
.dot.ok { background: var(--go); } .dot.wait { background: #f0a400; }
.padbody { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #4a5466; border-radius: 28px; padding: 10px 14px; }
.pside { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.pbtns { display: flex; gap: 6px; }
.pbtn { font: 600 12px var(--body); min-width: 40px; padding: 6px 4px; border-radius: 6px; border: 0; background: #2b3446; color: #fff; cursor: pointer; touch-action: none; }
.pbtn.on { background: var(--accent); }
.stick { width: 96px; height: 96px; border-radius: 50%; background: #2b3446; box-shadow: inset 0 3px 8px rgba(0,0,0,.4); display: grid; place-items: center; touch-action: none; cursor: grab; }
.knob { width: 44px; height: 44px; border-radius: 50%; background: #1c2230; border: 3px solid #6c7486; pointer-events: none; }
.paxes { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; color: #fff; font-family: var(--mono); font-size: 12px; }
.paxes span { color: #b9c0cc; margin-right: 4px; }
.paxes b { display: inline-block; min-width: 3.2ch; text-align: right; font-weight: 500; }
.lvl { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #c9d1de; }
.lvl select { font: 600 13px var(--body); background: #2b3446; color: #fff; border: 1px solid #3b465c; border-radius: 6px; padding: 6px 8px; }
.task { background: #eaf2fd; border: 1px solid #c4dbf7; border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
.task .needs { color: var(--muted); font-size: 12px; }
.led.bump button { border-radius: 6px; background: #d23a2f; border-color: #a52a21; }
.led.bump button.down { background: #8f2219; }
#field3d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; border-radius: 6px; }
.views { display: flex; gap: 0; }
.views .btn { border-radius: 0; margin-left: -1px; }
.views .btn:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
.views .btn:last-child { border-radius: 0 6px 6px 0; }
.views .btn[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); position: relative; }
.blocklyToolboxDiv { font-family: var(--body) !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <h1>Robot <b>Field</b> Sim</h1>
    <button class="btn" id="btnDevices" type="button">Devices</button>
    <button class="btn" id="btnOpen" type="button">Open</button>
    <button class="btn" id="btnSave" type="button">Save</button>
    <button class="btn" id="btnNew" type="button">New</button>
    <input type="file" id="fileIn" accept=".vrblocks,.iqblocks,.json,.txt" hidden>
    <label class="lvl" for="level">Level <select id="level"></select></label>
    <span class="sp"></span>
    <button class="btn" id="btnTeacher" type="button">Teacher settings</button>
  </div>
  <div class="main">
    <div id="blockly"></div>
    <aside class="side">
      <div class="controls">
        <button class="btn go" id="btnRun" type="button">▶ Start</button>
        <button class="btn stop" id="btnStop" type="button">■ Stop</button>
        <button class="btn" id="btnReset" type="button">↺ Reset</button>
        <label for="speed">Speed
          <select id="speed"><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
        </label>
        <label for="showPath"><input type="checkbox" id="showPath" checked> Path</label>
      </div>
      <div class="task" id="task" hidden></div>
      <div class="views" role="group" aria-label="Camera view">
        <button class="btn" type="button" data-view="top" aria-pressed="true">Top</button>
        <button class="btn" type="button" data-view="chase" aria-pressed="false">Behind robot</button>
        <button class="btn" type="button" data-view="field3d" aria-pressed="false">3D field</button>
      </div>
      <div class="fieldwrap"><canvas id="field" aria-label="Field view"></canvas><canvas id="field3d" hidden aria-label="3D field view"></canvas></div>
      <div class="controls">
        <button class="btn" id="btnWalls" type="button">Edit field</button>
        <button class="btn" id="btnDelWall" type="button" hidden>Delete</button>
        <button class="btn" id="btnClearWalls" type="button" hidden>Clear field</button>
        <button class="btn" id="btnShareLevel" type="button" hidden>Share level</button>
        <button class="btn" id="btnLoadLevel" type="button" hidden>Load level code</button>
        <button class="btn" id="btnCopyLevel" type="button" hidden>Copy to Build your own</button>
      </div>
      <div class="buildbar" id="buildBar" hidden>
        <div class="tools" role="group" aria-label="Build tool">
          <button class="btn" type="button" data-tool="wall">Wall</button>
          <button class="btn" type="button" data-tool="block">Block</button>
          <button class="btn" type="button" data-tool="tile">Color tile</button>
          <button class="btn" type="button" data-tool="tape">Tape line</button>
          <button class="btn" type="button" data-tool="start">Robot start</button>
        </div>
        <label id="bColorL">Color <select id="bColor"><option value="red">red</option><option value="green">green</option><option value="blue">blue</option><option value="yellow">yellow</option><option value="black">black</option></select></label>
        <label id="bHeadL">Facing <select id="bHead"><option value="0">up (0°)</option><option value="90">right (90°)</option><option value="180">down (180°)</option><option value="270">left (270°)</option></select></label>
        <label id="bTaskL" class="full">Task for students <textarea id="bTask" rows="2" maxlength="600" placeholder="Example: Drive to the green tile without touching a wall."></textarea></label>
      </div>
      <p class="hint" id="wallTip" hidden></p>
      <h2 class="sec">Robot</h2>
      <div class="readouts" id="readouts"></div>
      <div class="leds" id="leds"></div>
      <div class="pad" id="pad" hidden aria-label="Controller"></div>
      <h2 class="sec">Print console</h2>
      <div class="console" id="console" aria-live="polite"></div>
    </aside>
  </div>
</div>

<div class="modal" id="mDevices" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="devTitle">
    <header><h2 id="devTitle">Devices</h2><button class="btn" type="button" data-close>Done</button></header>
    <div class="body" id="devBody"></div>
  </div>
</div>
<div class="modal" id="mTeacher" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="tTitle">
    <header><h2 id="tTitle">Teacher settings</h2><button class="btn" type="button" data-close>Cancel</button></header>
    <div class="body" id="tBody"></div>
    <footer>
      <button class="btn" type="button" id="tDefaults">Restore defaults</button>
      <button class="btn" type="button" id="tExport">Copy settings code</button>
      <button class="btn" type="button" id="tImport">Paste settings code</button>
      <button class="btn primary" type="button" id="tSave">Save settings</button>
    </footer>
  </div>
</div>
<div class="modal" id="mText" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="xTitle">
    <header><h2 id="xTitle">Save project</h2><button class="btn" type="button" data-close>Close</button></header>
    <div class="body"><p class="hint" id="xHint"></p><textarea id="xText" aria-label="Project text"></textarea><div class="err-text" id="xErr"></div></div>
    <footer><button class="btn" type="button" id="xAction" hidden>Load</button><button class="btn primary" type="button" id="xCopy">Copy</button></footer>
  </div>
</div>

<script src="https://unpkg.com/blockly@10.4.3/blockly.min.js"></script>
<script>
"use strict";
/* =====================================================================
   Settings (teacher) and device configuration (student)
   Robot kit: VEX IQ, first generation (Gen 1) devices only.
   ===================================================================== */
const KIT = {
  name: "VEX IQ (Gen 1)", ports: 12, motorRPM: 120, wheelTravel: 200, track: 176, wheelbase: 156,
  wheels: [["160 mm wheel", 160], ["200 mm wheel", 200], ["250 mm wheel", 250]],
};
const PORT_ROLES = [   // the real robot's ports (teacher sets these)
  ["left", "Left drive motor"], ["right", "Right drive motor"], ["arm", "Arm motor"], ["claw", "Claw motor"],
  ["gyro", "Gyro sensor"], ["distance", "Distance sensor"], ["color", "Color sensor"], ["touchled", "Touch LED"], ["bumper", "Bumper switch"],
  ["bumper2", "Bumper switch 2"], ["bumper3", "Bumper switch 3"], ["touchled2", "Touch LED 2"],
];
// a sensor type can sit on its main port or on its numbered extra ports (bumper, bumper2, bumper3)
const roleKeys = role => [role, role + "2", role + "3"].filter(k => k in S.ports);
const onRolePort = (port, role) => roleKeys(role).some(k => S.ports[k] && S.ports[k] === port);
function defaultSettings() {
  return {
    version: 2, fieldW: 2000, fieldH: 2000, walls: true, grid: 250,
    startX: 0, startY: 0, startH: 0,
    robotL: 230, robotW: 200,
    wheelTravel: KIT.wheelTravel, track: KIT.track, gear: 1, motorRPM: KIT.motorRPM,
    rightMirrored: true, checkPorts: true, showPortMap: true, allowPosition: true,
    ports: { left: 1, right: 6, arm: 10, claw: 4, gyro: 5, distance: 7, color: 3, touchled: 2, bumper: 8, bumper2: 9, bumper3: 11, touchled2: 12 },
    distanceMax: 1000,
  };
}
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
function loadSettings(saved) {
  const d = defaultSettings();
  if (!saved || saved.version !== 2) return d;           // older saves used other kits; start fresh
  const s = Object.assign(d, saved); s.ports = Object.assign(defaultSettings().ports, saved.ports || {}); return s;
}
let S = loadSettings(LS.get("rfs.settings", null));
const KNOWN_TYPES = ["drivetrain", "motor", "gyro", "distance", "color", "touchled", "bumper", "controller"];
let DEVICES = LS.get("rfs.devices", []).filter(d => KNOWN_TYPES.includes(d.type));

const DEVICE_TYPES = {
  drivetrain: { label: "Drivetrain 2-motor", sub: "Two drive motors", base: "Drivetrain" },
  motor: { label: "Motor", sub: "One Smart Motor", base: "Motor" },
  gyro: { label: "Gyro sensor", sub: "Heading and rotation", base: "Gyro" },
  distance: { label: "Distance sensor", sub: "Gen 1 ultrasonic", base: "Distance" },
  color: { label: "Color sensor", sub: "Color and brightness", base: "Color" },
  touchled: { label: "Touch LED", sub: "Light you can press", base: "TouchLED" },
  bumper: { label: "Bumper switch", sub: "Pressed or not", base: "Bumper" },
  controller: { label: "Controller", sub: "IQ Controller", base: "Controller" },
};
const devOf = t => DEVICES.filter(d => d.type === t);
const drivetrain = () => DEVICES.find(d => d.type === "drivetrain");
const devByName = (t, n) => devOf(t).find(d => d.name === n) || null;
const controllerDev = () => DEVICES.find(d => d.type === "controller");

/* =====================================================================
   Blocks (drivetrain/control names match VEXcode VR so .vrblocks files open here)
   ===================================================================== */
const C = { events: "#FFBF00", drive: "#4C97FF", motion: "#4C97FF", looks: "#9966FF", control: "#FFAB19", sensing: "#5CB1D6", ops: "#59C059" };
const num = (name) => ({ type: "input_value", name, check: "Number" });
const dd = (name, opts) => ({ type: "field_dropdown", name, options: opts });
const stmt = (o) => Object.assign({ previousStatement: null, nextStatement: null, inputsInline: true }, o);
const DIRS = [["forward", "fwd"], ["reverse", "rev"]];
const TURNS = [["right", "right"], ["left", "left"]];
const DIST_UNITS = [["mm", "mm"], ["inches", "in"]];
const ROT_UNITS = [["degrees", "degrees"], ["turns", "turns"]];
// IQ Gen 1 color sensor color names
const IQ_COLORS = [["red", "red"], ["green", "green"], ["blue", "blue"], ["white", "white"], ["yellow", "yellow"], ["orange", "orange"],
  ["purple", "purple"], ["red violet", "red_violet"], ["violet", "violet"], ["blue violet", "blue_violet"], ["blue green", "blue_green"],
  ["yellow green", "yellow_green"], ["yellow orange", "yellow_orange"], ["red orange", "red_orange"]];
const LED_COLORS = [["none", "none"], ["red", "red"], ["green", "green"], ["blue", "blue"], ["white", "white"], ["yellow", "yellow"], ["orange", "orange"],
  ["purple", "purple"], ["red violet", "red_violet"], ["violet", "violet"], ["blue violet", "blue_violet"], ["blue green", "blue_green"],
  ["yellow green", "yellow_green"], ["yellow orange", "yellow_orange"], ["red orange", "red_orange"]];
const LED_HEX = { none: "#f4f5f7", red: "#ff2a2a", green: "#20c05a", blue: "#2a6bff", white: "#ffffff", yellow: "#ffe11a", orange: "#ff8a1a",
  purple: "#9a3cff", red_violet: "#e0237a", violet: "#7d3cff", blue_violet: "#5146ff", blue_green: "#1ab8a8", yellow_green: "#a4d81a",
  yellow_orange: "#ffb31a", red_orange: "#ff5a1a" };

Blockly.defineBlocksWithJsonArray([
  { type: "pg_events_when_started", message0: "when started", nextStatement: null, colour: C.events },
  // Drivetrain
  stmt({ type: "pg_drivetrain_drive", message0: "drive %1", args0: [dd("DIRECTION", DIRS)], colour: C.drive }),

function defDev(type, devType, colour, parts, shape) {
  Blockly.Blocks[type] = {
    init() {
      let inp = this.appendDummyInput("D0");

      for (const p of parts) {
        if (p === "@") { inp.appendField(new Blockly.FieldDropdown(deviceMenu(devType)), "DEVICE"); devPlaced = true; }
        else if (typeof p === "string") inp.appendField(p);
        else if (p[0] === "dd") inp.appendField(new Blockly.FieldDropdown(p[2]), p[1]);
        else if (p[0] === "value") { this.appendValueInput(p[1]).setCheck(p[2] || null); inp = this.appendDummyInput("D" + (++k)); }
      }
      if (!devPlaced) this.getInput("D0").insertFieldAt(0, new Blockly.FieldDropdown(deviceMenu(devType)), "DEVICE");
      this.setInputsInline(true);
      this.setColour(colour);
      if (shape === "stmt") { this.setPreviousStatement(true); this.setNextStatement(true); }
      else this.setOutput(true, shape);
    },
  };
}

function stadium(cx, cy, half, r, step) {   // a running-track shaped loop, as points
  const pts = [];
  for (let a = -90; a <= 90; a += step) pts.push([cx + half + r * Math.cos(a * Math.PI / 180), cy + r * Math.sin(a * Math.PI / 180)]);
  for (let a = 90; a <= 270; a += step) pts.push([cx - half + r * Math.cos(a * Math.PI / 180), cy + r * Math.sin(a * Math.PI / 180)]);
  pts.push(pts[0]);
  return pts;
}
function trickyTrack() {   // straight start, S-curves, a sharp corner, then a zigzag to the finish
  const pts = [[-750, -880], [-750, -450]];
  for (let y = -440; y <= 350; y += 10) pts.push([-750 + 170 * Math.sin(Math.PI * (y + 450) / 400), y]);
  pts.push([-750, 700], [150, 700], [450, 400], [150, 100], [450, -200], [450, -650]);
  return pts;
}
function corridorWalls(path, half) {   // walls on both sides of a path made of straight pieces
  const side = sgn => path.map((P, i) => {
    const A = path[Math.max(0, i - 1)], B = path[Math.min(path.length - 1, i + 1)];
    const n = (p, q) => { const dx = q[0] - p[0], dy = q[1] - p[1], l = Math.hypot(dx, dy); return [-dy / l, dx / l]; };
    const n1 = i > 0 ? n(A, P) : n(P, B), n2 = i < path.length - 1 ? n(P, B) : n(A, P);
    const k = 1 + n1[0] * n2[0] + n1[1] * n2[1];
    return [P[0] + sgn * half * (n1[0] + n2[0]) / k, P[1] + sgn * half * (n1[1] + n2[1]) / k];
  });
  const walls = [];
  for (const pts of [side(1), side(-1)]) for (let i = 1; i < pts.length; i++) walls.push({ x1: pts[i - 1][0], y1: pts[i - 1][1], x2: pts[i][0], y2: pts[i][1] });
  const a = side(1).pop(), b = side(-1).pop();
  walls.push({ x1: a[0], y1: a[1], x2: b[0], y2: b[1] });   // dead end after the finish
  return walls;
}

    case "pg_sensing_position": { const p = f("AXIS") === "y" ? W.y : W.x; return f("UNITS") === "in" ? p / 25.4 : p; }
    case "pg_sensing_drivetrain_is_done": return W.mode === "idle" || W.mode === "spin";
    case "pg_sensing_drivetrain_is_moving": return W.mode !== "idle";
    case "pg_sensing_drivetrain_heading": return +rd_heading().toFixed(2);
    case "pg_sensing_drivetrain_rotation": return +rd_rotation().toFixed(2);
    case "pg_sensing_drivetrain_velocity": return W.velocityNow;

    case "iq_motor_is_done": case "iq_motor_is_spinning": case "iq_motor_position": case "iq_motor_velocity": {

    if (d.type === "color") f += `<label>Sensor points<select id="fFacing"><option value="down" ${d.facing === "down" ? "selected" : ""}>Down at the field</option><option value="forward" ${d.facing === "forward" ? "selected" : ""}>Out from the robot</option></select></label>`;
    if (["distance", "color", "bumper"].includes(d.type)) f += `
      <label>Mounted on<select id="fMount">${MOUNTS.map(([v, n]) => `<option value="${v}" ${(d.mount || "front") === v ? "selected" : ""}>${n}</option>`).join("")}</select></label>
      <label>Shift along that side (mm)<input type="number" id="fOffset" step="5" value="${+d.offset || 0}"></label>
      <p class="hint full">The sensor faces straight out from the side it is on. Shift moves it along that side: on the front or back, + is toward the robot's right; on a side, + is toward the front. The field shows where it sits.</p>`;
  }
  devBody.innerHTML = `<fieldset><legend>${ICONS[d.type].replace('class="ic"', 'class="ic" style="vertical-align:middle;width:24px;height:24px"')} ${DEVICE_TYPES[d.type].label}</legend><div class="form">${f}</div></fieldset>
    <div class="err-text" id="fErr"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn primary" type="button" id="fOk">Done</button>
      <button class="btn" type="button" id="fCancel">Cancel</button>
      ${editing.orig ? `<span style="flex:1"></span><button class="btn stop" type="button" id="fDel">Delete device</button>` : ""}
    </div>`;
  document.getElementById("fCancel").onclick = () => { editing = null; renderDevices(); };
  if (editing.orig) document.getElementById("fDel").onclick = () => {
    const gone = editing.orig;
    DEVICES = DEVICES.filter(x => x !== gone);
    if (gone.type === "gyro") DEVICES.forEach(x => { if (x.type === "drivetrain" && x.gyro === gone.name) x.gyro = ""; });
    if (gone.type === "motor") DEVICES.forEach(x => { if (x.type === "controller") for (const k in x.buttons || {}) if (x.buttons[k] === gone.name) x.buttons[k] = ""; });
    editing = null; devicesChanged();
  };
  document.getElementById("fOk").onclick = () => {
    const g = id => document.getElementById(id);
    const nd = { ...d, name: g("fName").value.trim().replace(/[^A-Za-z0-9_]/g, "") || d.name };
    if (d.type === "controller") {
      nd.drive = g("fDrive").value; nd.buttons = {};
      for (const k of ["L", "R", "E", "F"]) nd.buttons[k] = g("fBtn" + k).value;
    } else if (d.type === "drivetrain") {
      Object.assign(nd, { left: +g("fLeft").value, right: +g("fRight").value, wheelTravel: +g("fWheel").value, gear: +g("fGear").value || 1,
        track: +g("fTrack").value || KIT.track, wheelbase: +g("fBase").value || 0, gyro: g("fGyro").value });
      if (nd.left === nd.right) { g("fErr").textContent = "Left and right motors need different ports."; return; }
    } else {
      nd.port = +g("fPort").value;
      if (d.type === "motor") nd.reverse = g("fRev").checked;
      if (d.type === "color") nd.facing = g("fFacing").value;
      if (g("fMount")) { nd.mount = g("fMount").value; nd.offset = +g("fOffset").value || 0; }
      const base = DEVICE_TYPES[d.type].base;
      if (new RegExp("^" + base + "\\d+$").test(nd.name)) nd.name = base + nd.port;   // keep default names in step with the port
    }
    if (DEVICES.some(x => x !== editing.orig && x.name === nd.name)) { g("fErr").textContent = "Another device already has that name."; return; }
    if (editing.orig) {
      if (d.type === "motor" && editing.orig.name !== nd.name) DEVICES.forEach(x => { if (x.type === "controller") for (const k in x.buttons || {}) if (x.buttons[k] === editing.orig.name) x.buttons[k] = nd.name; });
      if (d.type === "gyro" && editing.orig.name !== nd.name) DEVICES.forEach(x => { if (x.type === "drivetrain" && x.gyro === editing.orig.name) x.gyro = nd.name; });
      DEVICES[DEVICES.indexOf(editing.orig)] = nd;
    } else DEVICES.push(nd);
    editing = null; devicesChanged();
  };
}
function devicesChanged() {
  LS.set("rfs.devices", DEVICES);
  ws.updateToolbox(buildToolbox());
  if (!RUN) newWorld(); else W.warned = new Set();
  buildLeds(); buildPad(); renderDevices(); draw();
}

function readTeacher() {

  s.walls = g("t_walls").checked; s.allowPosition = g("t_allowPosition").checked; s.checkPorts = g("t_checkPorts").checked; s.rightMirrored = g("t_rightMirrored").checked; s.showPortMap = g("t_showPortMap").checked;
  PORT_ROLES.forEach(([k]) => { s.ports[k] = n("p_" + k); });

function applySettings(ns) {
  S = ns; LS.set("rfs.settings", S);

function projectJSON() {
  return JSON.stringify({ mode: "Blocks", platform: "RobotFieldSim", robotKit: "IQ Gen 1", robotConfig: DEVICES, level: LEVEL, fieldWalls: WALLS, ...(LEVEL === "open" ? { customLevel: CUSTOM } : {}),
    workspace: Blockly.Xml.domToText(Blockly.Xml.workspaceToDom(ws)) });
}
function openProject(text) {
  const data = JSON.parse(text);
  if (!data.workspace) throw new Error("This file has no blocks in it.");
  loadXml(data.workspace);
  if (Array.isArray(data.robotConfig) && data.robotConfig.length && data.robotConfig[0].type) DEVICES = data.robotConfig.filter(d => KNOWN_TYPES.includes(d.type));
  else if (data.playground) log(`Opened a VEXcode VR project. VR robots have no device setup, so add a Drivetrain${/distance/.test(data.workspace) ? " and sensors" : ""} in Devices.`, "warn");
  if (data.level && LEVELS.some(l => l.id === data.level)) setLevel(data.level, true);
  if (LEVEL === "open" && (data.customLevel || Array.isArray(data.fieldWalls))) loadCustomLevel(data.customLevel ? cleanCustom(data.customLevel) : { ...CUSTOM, walls: cleanCustom({ walls: data.fieldWalls }).walls });
  stopProgram(false); devicesChanged();
}

/* =====================================================================
   Field editing and the level builder. Tools: wall, block, color tile,
   tape line, robot start. Click an item to select it, drag to move it,
   Delete key or the button to remove it. Only "Build your own" is kept.
   ===================================================================== */
const btnWalls = document.getElementById("btnWalls"), btnDelWall = document.getElementById("btnDelWall"), wallTip = document.getElementById("wallTip");
const buildBar = document.getElementById("buildBar"), bColor = document.getElementById("bColor"), bHead = document.getElementById("bHead"), bTask = document.getElementById("bTask");
const TOOL_TIPS = {
  wall: "Drag on the field to draw a wall (hold Shift for an angled wall).",
  block: "Click the field to drop a 150 mm block the robot can bump into.",
  tile: "Click the field to paint a 200 mm color tile the Color sensor can see.",
  tape: "Drag on the field to lay a strip of tape for line tracing (hold Shift for an angle). Start a strip at the end of another to join them into a path.",
  start: "Click the field to put the robot's start spot there. Pick which way it faces first.",
};
function setEdit(on) {
  if (on && V3.mode !== "top") setView("top");
  if (on && RUN) stopProgram(false);
  if (!on && EDIT.on && LEVEL === "open") saveCustom();
  EDIT.on = on; EDIT.sel = null; EDIT.draft = null; EDIT.drag = null;
  btnWalls.textContent = on ? "Done editing" : LEVEL === "open" ? "Build level" : "Edit field";
  btnWalls.classList.toggle("primary", on);
  buildBar.hidden = wallTip.hidden = !on; cv.style.cursor = on ? "crosshair" : "";
  if (on) { bTask.value = CUSTOM.task || ""; bHead.value = String(START ? ((START[2] % 360) + 360) % 360 : 0); setTool(EDIT.tool); }
  updateWallButtons(); draw();
}
function setTool(t) {
  EDIT.tool = t;
  buildBar.querySelectorAll("[data-tool]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.tool === t)));
  if (t === "tape" && EDIT.color !== "black") EDIT.color = "black";
  if (t === "tile" && EDIT.color === "black") EDIT.color = "red";
  bColor.value = EDIT.color;
  document.getElementById("bColorL").hidden = !(t === "tile" || t === "tape");
  document.getElementById("bHeadL").hidden = t !== "start";
  document.getElementById("bTaskL").hidden = LEVEL !== "open";
  wallTip.textContent = TOOL_TIPS[t] + " Click anything to select it and drag to move it." +
    (LEVEL === "open" ? " Your level saves in this browser. Use Share level to give it to students." : " Changes on a built-in level go away when you pick the level again. Use Copy to Build your own to keep them.");
}
buildBar.querySelectorAll("[data-tool]").forEach(b => b.onclick = () => setTool(b.dataset.tool));
bColor.onchange = () => { EDIT.color = bColor.value; };
bHead.onchange = () => { if (START || EDIT.tool === "start") { const P = startPose(); START = [P.x, P.y, +bHead.value]; saveCustom(); newWorld(); draw(); } };
bTask.oninput = () => { if (LEVEL !== "open") return; CUSTOM.task = bTask.value.slice(0, 600); saveCustom(); renderTask(); };
function updateWallButtons() {
  btnDelWall.hidden = !(EDIT.on && EDIT.sel);
  document.getElementById("btnClearWalls").hidden = !(EDIT.on && (WALLS.length || FLOOR.length));
  document.getElementById("btnShareLevel").hidden = document.getElementById("btnLoadLevel").hidden = !EDIT.on;
  document.getElementById("btnCopyLevel").hidden = !(EDIT.on && LEVEL !== "open");
  if (!EDIT.on) btnWalls.textContent = LEVEL === "open" ? "Build level" : "Edit field";
}
function toField(e) {
  const r = cv.getBoundingClientRect(), px = (e.clientX - r.left) * VIEW.dpr, py = (e.clientY - r.top) * VIEW.dpr;
  const snap = v => Math.round(v / 10) * 10;
  return [snap((px - VIEW.Wd / 2) / VIEW.sc), snap((VIEW.Ht / 2 - py) / VIEW.sc)];
}
function wallAt(x, y) { for (let i = WALLS.length - 1; i >= 0; i--) if (pointInPoly(x, y, wallPoly(WALLS[i]))) return i; return -1; }
function floorItemAt(x, y) {
  for (let i = FLOOR.length - 1; i >= 0; i--) {
    const f = FLOOR[i];
    if (f.rect) { const [rx, ry, rw, rh] = f.rect; if (x >= rx && x <= rx + rw && y >= ry && y <= ry + rh) return i; }
    else for (let k = 1; k < f.line.length; k++) if (segDist(x, y, f.line[k - 1], f.line[k]) <= Math.max(15, f.width / 2)) return i;
  }
  return -1;
}
function itemAt(x, y) {
  const w = wallAt(x, y); if (w >= 0) return { k: "wall", i: w };
  const f = floorItemAt(x, y); return f >= 0 ? { k: "floor", i: f } : null;
}
const cloneItem = sel => sel.k === "wall" ? { ...WALLS[sel.i] } : copyFloor([FLOOR[sel.i]])[0];
const onRobot = w => polysOverlap(corners(W.x, W.y, W.rot), wallPoly(w));
const LIVE = { drag: null };   // moving a wall outside edit mode, even while the program runs
cv.addEventListener("pointerdown", e => {
  if (!EDIT.on) {
    const [x, y] = toField(e), hit = wallAt(x, y);
    if (hit < 0) return;
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    LIVE.drag = { i: hit, x, y, orig: { ...WALLS[hit] } }; cv.style.cursor = "grabbing";
    return;
  }
  e.preventDefault(); cv.setPointerCapture(e.pointerId);
  const [x, y] = toField(e);
  if (EDIT.tool === "start") {
    const hx = S.fieldW / 2, hy = S.fieldH / 2;
    START = [Math.max(-hx, Math.min(hx, x)), Math.max(-hy, Math.min(hy, y)), +bHead.value];
    newWorld(); paintLeds(); saveCustom(); draw();
    if (WALLS.some(w => onRobot(w))) log("The robot starts on top of a wall there. Move the start spot or the wall.", "warn");
    return;
  }
  // with the tape tool, starting at the end of a strip begins a new strip there, so strips join up
  if (EDIT.tool === "tape") {
    for (const f of FLOOR) if (f.line) for (const q of [f.line[0], f.line[f.line.length - 1]]) if (Math.hypot(q[0] - x, q[1] - y) <= 30) {
      EDIT.sel = null; EDIT.draft = { tape: true, x1: q[0], y1: q[1], x2: q[0], y2: q[1] }; updateWallButtons(); draw(); return;
    }
  }
  const hit = itemAt(x, y);
  if (hit) { EDIT.sel = hit; EDIT.drag = { x, y, orig: cloneItem(hit) }; }
  else {
    EDIT.sel = null;
    if (EDIT.tool === "wall") EDIT.draft = { x1: x, y1: y, x2: x, y2: y };
    else if (EDIT.tool === "tape") EDIT.draft = { tape: true, x1: x, y1: y, x2: x, y2: y };
    else if (EDIT.tool === "block") {
      const b = { x1: x - 55, y1: y, x2: x + 55, y2: y, t: 150 };   // 150 mm square
      if (onRobot(b)) log("A block can't go on top of the robot.", "warn");
      else { WALLS.push(b); EDIT.sel = { k: "wall", i: WALLS.length - 1 }; EDIT.drag = { x, y, orig: { ...b } }; }
    } else if (EDIT.tool === "tile") {
      const c = v => Math.round(v / 50) * 50;
      FLOOR.push(tile(c(x), c(y), EDIT.color, 200)); FLOOR_VER++;
      EDIT.sel = { k: "floor", i: FLOOR.length - 1 }; EDIT.drag = { x, y, orig: cloneItem(EDIT.sel) };
    }
  }
  updateWallButtons(); draw();
});
cv.addEventListener("pointermove", e => {
  if (!EDIT.on) {
    const [x, y] = toField(e);
    if (!LIVE.drag) { cv.style.cursor = wallAt(x, y) >= 0 ? "grab" : ""; return; }
    const o = LIVE.drag.orig, dx = x - LIVE.drag.x, dy = y - LIVE.drag.y;
    const nw = { ...o, x1: o.x1 + dx, y1: o.y1 + dy, x2: o.x2 + dx, y2: o.y2 + dy };
    if (!onRobot(nw)) WALLS[LIVE.drag.i] = nw;   // a wall can't be pushed into the robot
    if (!RUN) draw();
    return;
  }
  const [x, y] = toField(e);
  if (EDIT.draft) {
    // hold Shift for any angle; otherwise keep it straight up/down or across
    let x2 = x, y2 = y;
    if (!e.shiftKey) { if (Math.abs(x - EDIT.draft.x1) >= Math.abs(y - EDIT.draft.y1)) y2 = EDIT.draft.y1; else x2 = EDIT.draft.x1; }
    EDIT.draft.x2 = x2; EDIT.draft.y2 = y2; draw();
  } else if (EDIT.drag && EDIT.sel) {
    const dx = x - EDIT.drag.x, dy = y - EDIT.drag.y, o = EDIT.drag.orig;
    if (EDIT.sel.k === "wall") WALLS[EDIT.sel.i] = { ...o, x1: o.x1 + dx, y1: o.y1 + dy, x2: o.x2 + dx, y2: o.y2 + dy };
    else {
      FLOOR[EDIT.sel.i] = o.rect ? { ...o, rect: [o.rect[0] + dx, o.rect[1] + dy, o.rect[2], o.rect[3]] } : { ...o, line: o.line.map(([px, py]) => [px + dx, py + dy]) };
      FLOOR_VER++;
    }
    draw();
  }
});
cv.addEventListener("pointerup", () => {
  if (!EDIT.on) { if (LIVE.drag) { LIVE.drag = null; cv.style.cursor = "grab"; saveCustom(); } return; }
  if (EDIT.draft) {
    const d = EDIT.draft, len = Math.hypot(d.x2 - d.x1, d.y2 - d.y1);
    if (len >= 50) {
      if (d.tape) { FLOOR.push({ line: [[d.x1, d.y1], [d.x2, d.y2]], width: 25, color: EDIT.color }); FLOOR_VER++; EDIT.sel = { k: "floor", i: FLOOR.length - 1 }; }
      else if (onRobot(d)) log("That wall would sit on top of the robot. Draw it somewhere else.", "warn");
      else { WALLS.push({ x1: d.x1, y1: d.y1, x2: d.x2, y2: d.y2 }); EDIT.sel = { k: "wall", i: WALLS.length - 1 }; }
    }
    EDIT.draft = null;
  }
  if (EDIT.drag && EDIT.sel && EDIT.sel.k === "wall" && onRobot(WALLS[EDIT.sel.i])) { WALLS[EDIT.sel.i] = EDIT.drag.orig; log("A wall can't go on top of the robot.", "warn"); }
  EDIT.drag = null; saveCustom(); updateWallButtons(); draw();
});
function deleteSelectedWall() {
  if (!EDIT.sel) return;
  if (EDIT.sel.k === "wall") WALLS.splice(EDIT.sel.i, 1); else { FLOOR.splice(EDIT.sel.i, 1); FLOOR_VER++; }
  EDIT.sel = null; saveCustom(); updateWallButtons(); draw();
}

/* =====================================================================
   Controller: on-screen pad, keyboard, USB game controller, and the real
   VEX IQ controller relayed by the Brain over USB (Web Serial).
   Axes A-D read -100..100 like VEXcode: A = left stick up/down, B = left stick
   left/right, C = right stick left/right, D = right stick up/down.
   ===================================================================== */
const DRIVE_MODES = [["none", "None (I'll program it)"], ["tank", "Tank drive (A and D)"], ["left_arcade", "Left arcade (A and B)"],
  ["right_arcade", "Right arcade (D and C)"], ["split_arcade", "Split arcade (A and C)"]];
const BTN_KEYS = BUTTONS.map(b => b[1]);
const zeroAxes = () => ({ A: 0, B: 0, C: 0, D: 0 });
const zeroBtns = () => Object.fromEntries(BTN_KEYS.map(k => [k, false]));
const CTRL = { axes: zeroAxes(), btn: zeroBtns(), source: "" };
const SCREEN = { axes: zeroAxes(), btn: zeroBtns() };
const SER = { axes: zeroAxes(), btn: zeroBtns(), t: 0, ports: [], lines: 0, opened: 0 };
const KEYS = new Set();
const KEYMAP = { KeyW: ["A", 100], KeyS: ["A", -100], KeyA: ["B", -100], KeyD: ["B", 100],
  ArrowUp: ["D", 100], ArrowDown: ["D", -100], ArrowLeft: ["C", -100], ArrowRight: ["C", 100] };
const KEYBTN = { Digit1: "EUp", Digit2: "EDown", Digit3: "FUp", Digit4: "FDown", Digit5: "LUp", Digit6: "LDown", Digit7: "RUp", Digit8: "RDown" };
const PAD_BTN = { EUp: 3, EDown: 0, FUp: 2, FDown: 1, LUp: 4, LDown: 6, RUp: 5, RDown: 7 };   // standard gamepad button numbers (Y A X B LB LT RB RT)

function readCtrl() {
  const axes = zeroAxes(), btn = zeroBtns(), srcs = new Set();
  const take = (a, v, src) => { v = Math.round(Math.max(-100, Math.min(100, v))); if (Math.abs(v) > Math.abs(axes[a])) axes[a] = v; if (v) srcs.add(src); };
  const press = (k, on, src) => { if (on) { btn[k] = true; srcs.add(src); } };
  for (const a in SCREEN.axes) take(a, SCREEN.axes[a], "screen");
  for (const k of BTN_KEYS) press(k, SCREEN.btn[k], "screen");
  for (const c of KEYS) { if (KEYMAP[c]) take(KEYMAP[c][0], KEYMAP[c][1], "keys"); if (KEYBTN[c]) press(KEYBTN[c], true, "keys"); }
  if (performance.now() - SER.t < 300) {
    for (const a in SER.axes) take(a, SER.axes[a], "brain");
    for (const k of BTN_KEYS) press(k, SER.btn[k], "brain");
  }
  const pads = navigator.getGamepads ? Array.from(navigator.getGamepads()).filter(Boolean) : [];
  for (const gp of pads) {
    const ax = i => { const v = gp.axes[i] || 0; return Math.abs(v) < 0.08 ? 0 : v * 100; };
    take("A", -ax(1), "gamepad"); take("B", ax(0), "gamepad"); take("C", ax(2), "gamepad"); take("D", -ax(3), "gamepad");
    for (const k of BTN_KEYS) { const b = gp.buttons[PAD_BTN[k]]; press(k, !!b && (b.pressed || b.value > 0.5), "gamepad"); }
  }
  CTRL.axes = axes; CTRL.btn = btn; CTRL.source = [...srcs].join(", ");
}

/* runs once per physics tick while a program runs */
function controllerTick() {
  readCtrl();
  if (!RUN || !controllerDev()) return;
  const cur = { axes: { ...CTRL.axes }, btn: { ...CTRL.btn } }, prev = RUN.prevCtrl;
  RUN.prevCtrl = cur;
  if (prev) for (const h of RUN.hats) {
    let fire;
    if (h.type === "iq_controller_when_button") {
      const k = h.getFieldValue("BUTTON"), want = h.getFieldValue("ACTION") === "pressed";
      fire = cur.btn[k] === want && prev.btn[k] !== want;
    } else { const a = h.getFieldValue("AXIS"); fire = cur.axes[a] !== prev.axes[a]; }
    if (!fire) continue;
    const running = RUN.hatRuns.get(h.id);
    if (running && RUN.scripts.includes(running)) continue;   // still busy from last time
    const g = runStack(h.getNextBlock()); RUN.hatRuns.set(h.id, g); RUN.scripts.push(g);
  }
  if (RUN.actionsOn) applyActions();
}
function applyActions() {
  const cd = controllerDev(), dt = drivetrain(), a = CTRL.axes;
  if (dt && cd.drive && cd.drive !== "none") {
    let L, R;
    if (cd.drive === "tank") { L = a.A; R = a.D; }
    else {
      const [fwd, turn] = cd.drive === "left_arcade" ? [a.A, a.B] : cd.drive === "right_arcade" ? [a.D, a.C] : [a.A, a.C];
      L = fwd + turn; R = fwd - turn;
    }
    const dz = v => Math.abs(v) < 5 ? 0 : Math.max(-100, Math.min(100, v));
    L = dz(L); R = dz(R);
    if (L || R) { W.mode = "spin"; W.cmd = { l: Math.sign(L), r: Math.sign(R), lp: () => Math.abs(L), rp: () => Math.abs(R), ctrl: true }; }
    else if (W.cmd && W.cmd.ctrl) { W.mode = "idle"; W.cmd = null; }
  }
  for (const k of ["L", "R", "E", "F"]) {
    const name = (cd.buttons || {})[k], st = name && W.motors[name];
    if (!st) continue;
    const up = CTRL.btn[k + "Up"], down = CTRL.btn[k + "Down"];
    if (up || down) { st.mode = "spin"; st.dir = up ? 1 : -1; st.ctrl = true; }
    else if (st.ctrl) { st.mode = "idle"; st.ctrl = false; }
  }
}
function releaseActions() {
  if (W.cmd && W.cmd.ctrl) { W.mode = "idle"; W.cmd = null; }
  Object.values(W.motors).forEach(st => { if (st.ctrl) { st.mode = "idle"; st.ctrl = false; } });
}

/* ---- keyboard ---- */
const typingTarget = el => !!el && (/INPUT|TEXTAREA|SELECT/.test(el.tagName) || el.isContentEditable);
document.addEventListener("keydown", e => {
  if (!controllerDev() || typingTarget(e.target) || e.ctrlKey || e.metaKey || e.altKey) return;
  if (document.querySelector(".modal:not([hidden])")) return;
  if (KEYMAP[e.code] || KEYBTN[e.code]) { KEYS.add(e.code); e.preventDefault(); }
});
document.addEventListener("keyup", e => KEYS.delete(e.code));
window.addEventListener("blur", () => KEYS.clear());

/* ---- real controller through the Brain (Web Serial) ---- */
const BRAIN_PROGRAM = `# Robot Field Sim controller link
# In VEXcode IQ: start a new Python project, replace everything with this,
# then download it to the Brain. Keep the Brain plugged in with USB.
from vex import *

brain = Brain()
controller = Controller()

def b(button):
    return "1" if button.pressing() else "0"

while True:
    buttons = (b(controller.buttonEUp) + b(controller.buttonEDown) +
               b(controller.buttonFUp) + b(controller.buttonFDown) +
               b(controller.buttonLUp) + b(controller.buttonLDown) +
               b(controller.buttonRUp) + b(controller.buttonRDown))
    print("C,%d,%d,%d,%d,%s" % (controller.axisA.position(), controller.axisB.position(),
                                controller.axisC.position(), controller.axisD.position(), buttons))
    wait(40, MSEC)
`;
const LINE_RE = /C,(-?\d+),(-?\d+),(-?\d+),(-?\d+),([01]{8})/;
function parseBrainLine(line) {
  SER.lines++;
  const m = LINE_RE.exec(line);
  if (!m) return false;
  SER.axes = { A: +m[1], B: +m[2], C: +m[3], D: +m[4] };
  BTN_KEYS.forEach((k, i) => SER.btn[k] = m[5][i] === "1");
  SER.t = performance.now();
  return true;
}
let padNote = "";
async function connectBrain() {
  if (!navigator.serial) {
    padNote = "This browser can't talk to the Brain. Open the simulator from the class website in Chrome or Edge on a computer.";
    return;
  }
  let port;
  try { port = await navigator.serial.requestPort({ filters: [{ usbVendorId: 0x2888 }] }); }
  catch (e) {
    if (e.name !== "NotFoundError") padNote = e.name === "SecurityError"
      ? "USB isn't allowed on this copy of the page. Open the simulator from the class website (stopper122.github.io/robotics) in Chrome or Edge."
      : "Couldn't connect: " + e.message;
    return;
  }
  try { await port.open({ baudRate: 115200 }); }
  catch (e) { padNote = "Couldn't open that port. Close VEXcode (it may be using the Brain) and try again."; return; }
  SER.ports.push(port); SER.opened = performance.now(); padNote = "";
  const dec = new TextDecoder();
  let buf = "";
  try {
    while (port.readable) {
      const reader = port.readable.getReader();
      try {
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const parts = buf.split(/\r?\n/); buf = parts.pop();
          if (buf.length > 400) buf = "";
          parts.forEach(parseBrainLine);
        }
      } finally { reader.releaseLock(); }
    }
  } catch (e) { /* unplugged */ }
  SER.ports = SER.ports.filter(p => p !== port);
  try { await port.close(); } catch (e) {}
  padNote = "The Brain was disconnected.";
}
function brainStatus() {
  const now = performance.now();
  if (now - SER.t < 300) return ["ok", "Real controller connected through the Brain"];
  if (SER.ports.length) {
    if (now - SER.opened < 2500) return ["wait", "Brain connected. Waiting for controller data..."];
    if (SER.lines) return ["wait", "The Brain is sending, but not controller data. Run the Brain program (see How?)."];
    return ["wait", "Brain connected, but no data. Run the Brain program, or click Connect again and pick the other VEX port."];
  }
  return ["off", padNote || "Using the on-screen controller and keyboard"];
}

/* ---- on-screen controller ---- */
const padBox = document.getElementById("pad");
let padRaf = 0;
function buildPad() {
  const cd = controllerDev();
  padBox.hidden = !cd;
  if (!cd) { cancelAnimationFrame(padRaf); padRaf = 0; return; }
  const b = (k, label) => `<button type="button" class="pbtn" data-btn="${k}" aria-label="${label}">${label}</button>`;
  padBox.innerHTML = `
    <div class="padtop"><span class="dot" id="padDot"></span><span id="padStatus" class="padstatus"></span>
      <button class="btn" type="button" id="padConnect">Connect real controller</button>
      <button class="btn" type="button" id="padHow">How?</button></div>
    <div class="padbody">
      <div class="pside">
        <div class="pbtns">${b("LUp", "L▲")}${b("LDown", "L▼")}</div>
        <div class="stick" data-stick="L" aria-label="Left stick (axes A and B)"><div class="knob"></div></div>
        <div class="pbtns">${b("EUp", "E▲")}${b("EDown", "E▼")}</div>
      </div>
      <div class="paxes" id="padAxes"></div>
      <div class="pside">
        <div class="pbtns">${b("RUp", "R▲")}${b("RDown", "R▼")}</div>
        <div class="stick" data-stick="R" aria-label="Right stick (axes C and D)"><div class="knob"></div></div>
        <div class="pbtns">${b("FUp", "F▲")}${b("FDown", "F▼")}</div>
      </div>
    </div>
    <p class="hint">Drag the sticks or use the keyboard: W A S D = left stick, arrow keys = right stick, 1 to 8 = E▲ E▼ F▲ F▼ L▲ L▼ R▲ R▼. An Xbox-style USB controller works too.</p>`;
  padBox.querySelectorAll("[data-btn]").forEach(el => {
    const set = on => { SCREEN.btn[el.dataset.btn] = on; };
    el.addEventListener("pointerdown", e => { e.preventDefault(); el.setPointerCapture(e.pointerId); set(true); });
    el.addEventListener("pointerup", () => set(false));
    el.addEventListener("pointercancel", () => set(false));
  });
  padBox.querySelectorAll("[data-stick]").forEach(el => {
    const [ay, ax] = el.dataset.stick === "L" ? ["A", "B"] : ["D", "C"];
    const move = e => {
      const r = el.getBoundingClientRect(), rad = r.width / 2;
      let dx = (e.clientX - r.left - rad) / (rad * 0.7), dy = (e.clientY - r.top - rad) / (rad * 0.7);
      const m = Math.hypot(dx, dy); if (m > 1) { dx /= m; dy /= m; }
      SCREEN.axes[ax] = Math.round(dx * 100); SCREEN.axes[ay] = Math.round(-dy * 100);
    };
    el.addEventListener("pointerdown", e => { e.preventDefault(); el.setPointerCapture(e.pointerId); el.dataset.drag = "1"; move(e); });
    el.addEventListener("pointermove", e => { if (el.dataset.drag) move(e); });
    const end = () => { delete el.dataset.drag; SCREEN.axes[ax] = 0; SCREEN.axes[ay] = 0; };
    el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
  });
  document.getElementById("padConnect").onclick = () => { connectBrain(); };
  document.getElementById("padHow").onclick = () => textDialog("Use the real controller",
    "1) Copy this program into a new VEXcode IQ Python project and download it to the Brain. 2) Close VEXcode, keep the Brain plugged in with USB, and turn on the paired controller. 3) Run the program on the Brain. 4) Click \"Connect real controller\" and pick the VEX port. If nothing moves, click it again and pick the other VEX port. Works in Chrome or Edge from the class website.",
    BRAIN_PROGRAM, null);
  if (!padRaf) padRaf = requestAnimationFrame(padLoop);
}
function padLoop() {
  padRaf = 0;
  if (padBox.hidden) return;
  if (!RUN) readCtrl();
  const knob = (stick, x, y) => { const el = padBox.querySelector(`[data-stick="${stick}"] .knob`); if (el) el.style.transform = `translate(${x * 0.3}px, ${-y * 0.3}px)`; };
  knob("L", CTRL.axes.B, CTRL.axes.A); knob("R", CTRL.axes.C, CTRL.axes.D);
  padBox.querySelectorAll("[data-btn]").forEach(el => el.classList.toggle("on", !!CTRL.btn[el.dataset.btn]));
  const ax = document.getElementById("padAxes");
  const html = ["A", "B", "C", "D"].map(a => `<div><span>${a}</span><b>${CTRL.axes[a]}</b></div>`).join("");
  if (ax && ax.innerHTML !== html) ax.innerHTML = html;
  const [cls, text] = brainStatus(), st = document.getElementById("padStatus"), dot = document.getElementById("padDot");
  if (st && st.textContent !== text) st.textContent = text;
  if (dot) dot.className = "dot " + cls;
  padRaf = requestAnimationFrame(padLoop);
}


/* =====================================================================
   3D views (three.js, loaded the first time a 3D view is picked).
   Sim x -> 3D x, sim y -> 3D -z, height -> 3D y. Units are mm.
   ===================================================================== */
var V3 = { mode: "top", ready: false, loading: false, failed: false, sig: { floor: "", walls: "" }, cam: null };
const cv3 = document.getElementById("field3d");
function setView(mode) {
  if (mode !== "top" && EDIT.on) setEdit(false);
  V3.mode = mode;
  document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === mode)));
  cv3.hidden = mode === "top";
  if (mode !== "top" && !V3.ready) { load3d(); return; }
  V3.cam = null; draw();
}
function load3d() {
  if (V3.loading) return;
  if (window.THREE) { init3d(); return; }
  V3.loading = true;
  const s = document.createElement("script");
  s.src = "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";
  s.onload = () => { V3.loading = false; init3d(); };
  s.onerror = () => { V3.loading = false; log("The 3D view couldn't load. Check the internet connection and try again.", "warn"); setView("top"); };
  document.head.appendChild(s);
}
function init3d() {

    V3.scene = new T.Scene();
    V3.scene.background = new T.Color("#bcd3ea");
    V3.camera = new T.PerspectiveCamera(55, 1, 5, 30000);
    V3.scene.add(new T.HemisphereLight(0xffffff, 0x8a8f98, 0.85));
    const sun = new T.DirectionalLight(0xffffff, 0.6); sun.position.set(800, 2500, 1200); V3.scene.add(sun);
    // floor: a canvas texture so tiles, lines and pen trails look the same as the top view
    V3.floorCanvas = document.createElement("canvas"); V3.floorCanvas.width = V3.floorCanvas.height = 2048;
    V3.floorTex = new T.CanvasTexture(V3.floorCanvas);
    V3.floorTex.anisotropy = V3.renderer.capabilities.getMaxAnisotropy();
    V3.floor = new T.Mesh(new T.PlaneGeometry(1, 1), new T.MeshLambertMaterial({ map: V3.floorTex }));
    V3.floor.rotation.x = -Math.PI / 2; V3.scene.add(V3.floor);
    V3.ground = new T.Mesh(new T.PlaneGeometry(40000, 40000), new T.MeshLambertMaterial({ color: 0x8a8f98 }));
    V3.ground.rotation.x = -Math.PI / 2; V3.ground.position.y = -2; V3.scene.add(V3.ground);
    V3.walls = new T.Group(); V3.scene.add(V3.walls);
    V3.robot = new T.Group(); V3.scene.add(V3.robot);
    V3.beams = new T.Group(); V3.scene.add(V3.beams);
    V3.ready = true;
    V3.cam = null; draw();
  } catch (e) {

    setView("top");
  }
}
const v3 = (x, y, h) => new THREE.Vector3(x, h || 0, -y);
function paintFloor() {
  const g = V3.floorCanvas.getContext("2d"), N = V3.floorCanvas.width, hx = S.fieldW / 2, hy = S.fieldH / 2;
  const sc = N / Math.max(S.fieldW, S.fieldH), X = x => (x + hx) * sc, Y = y => (hy - y) * sc;
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, N, N);

  for (let gx = Math.ceil(-hx / S.grid) * S.grid; gx <= hx; gx += S.grid) { g.beginPath(); g.moveTo(X(gx), 0); g.lineTo(X(gx), S.fieldH * sc); g.stroke(); }
  for (let gy = Math.ceil(-hy / S.grid) * S.grid; gy <= hy; gy += S.grid) { g.beginPath(); g.moveTo(0, Y(gy)); g.lineTo(S.fieldW * sc, Y(gy)); g.stroke(); }
  for (const f of FLOOR) {
    const col = FLOOR_COLORS[f.color].hex;
    if (f.rect) { const [rx, ry, rw, rh] = f.rect; g.fillStyle = col; g.fillRect(X(rx), Y(ry + rh), rw * sc, rh * sc); }
    else if (f.line) { g.strokeStyle = col; g.lineWidth = f.width * sc; g.lineJoin = g.lineCap = "round"; g.beginPath(); f.line.forEach(([px, py], i) => i ? g.lineTo(X(px), Y(py)) : g.moveTo(X(px), Y(py))); g.stroke(); }
  }
  for (const gd of lvl().guides || []) { g.strokeStyle = "#1f6fd1"; g.lineWidth = 6; g.setLineDash([24, 16]); g.beginPath(); g.moveTo(X(gd.x1), Y(gd.y)); g.lineTo(X(gd.x2), Y(gd.y)); g.stroke(); g.setLineDash([]); }
  g.lineCap = g.lineJoin = "round";
  for (const tr of W.trails) { g.strokeStyle = PEN[tr.color] || "#111"; g.lineWidth = 12; g.beginPath(); tr.pts.forEach(([px, py], i) => i ? g.lineTo(X(px), Y(py)) : g.moveTo(X(px), Y(py))); g.stroke(); }
  V3.floorTex.needsUpdate = true;
  // the texture is square; show only the field part of it
  const u = S.fieldW * sc / N, v = S.fieldH * sc / N;

function box(w, h, d, color) { return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color })); }
function buildWalls3d() {
  const T = THREE, grp = V3.walls;
  while (grp.children.length) { const c = grp.children.pop(); c.geometry.dispose(); c.material.dispose(); }
  const H = 150;
  for (const w of WALLS) {
    const len = Math.hypot(w.x2 - w.x1, w.y2 - w.y1) + WALL_T, m = box(len, H, w.t || WALL_T, w.t ? 0xb5651d : 0x3a4252);
    m.position.copy(v3((w.x1 + w.x2) / 2, (w.y1 + w.y2) / 2, H / 2));
    m.rotation.y = Math.atan2(w.y2 - w.y1, w.x2 - w.x1);

  }

    [[0, hy + t / 2, S.fieldW + 2 * t, t], [0, -hy - t / 2, S.fieldW + 2 * t, t], [hx + t / 2, 0, t, S.fieldH], [-hx - t / 2, 0, t, S.fieldH]].forEach(([x, y, a, b]) => {

  }
}
function buildRobot3d() {
  const grp = V3.robot;
  while (grp.children.length) { const c = grp.children.pop(); c.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); }); }
  const L = S.robotL, Wd = S.robotW, wh = Math.min(60, Wd * 0.18);
  const body = box(Wd - 2 * wh, 90, L, 0x4a5466); body.position.y = 75; grp.add(body);
  const front = box(Wd - 2 * wh, 92, L * 0.22, 0xf08a00); front.position.set(0, 76, -L / 2 + L * 0.11); grp.add(front);
  const brain = box((Wd - 2 * wh) * 0.7, 20, L * 0.45, 0x20252e); brain.position.set(0, 130, L * 0.08); grp.add(brain);
  const wheelGeo = new THREE.CylinderGeometry(32, 32, wh * 0.8, 24);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const wm = new THREE.Mesh(wheelGeo.clone(), new THREE.MeshLambertMaterial({ color: 0x20252e }));
    wm.rotation.z = Math.PI / 2; wm.position.set(sx * (Wd / 2 - wh * 0.45), 32, sz * L * 0.3); grp.add(wm);
  }
  wheelGeo.dispose();
  const SENS_COL = { distance: 0xd23a2f, color: 0xe0237a, bumper: 0x1d9b55 };
  for (const d of DEVICES) {
    if (!SENS_COL[d.type]) continue;
    const m = mountLocal(d), s = box(40, 30, 24, SENS_COL[d.type]);
    s.position.set(m.r, d.type === "color" && d.facing === "down" ? 30 : 60, -m.f);
    s.rotation.y = -m.ang * DEG;
    grp.add(s);
  }
  if (S.ports.claw && devOf("motor").length) {
    const open = Math.max(0, Math.min(1, W.claw / 90)), gap = Wd * (0.08 + 0.18 * open);
    for (const sx of [-1, 1]) { const f = box(10, 40, L * 0.18, 0x6c7486); f.position.set(sx * (gap + 5), 40, -L / 2 - L * 0.07); grp.add(f); }
  }
}
function render3d() {
  if (V3.mode === "top" || !V3.ready) return;
  const T = THREE, wrap = cv3.parentElement, w = wrap.clientWidth, h = wrap.clientHeight;
  if (V3.w !== w || V3.h !== h) { V3.w = w; V3.h = h; V3.renderer.setSize(w, h, false); V3.camera.aspect = w / h; V3.camera.updateProjectionMatrix(); }
  // rebuild only what changed
  const fsig = [LEVEL, FLOOR_VER, S.fieldW, S.fieldH, S.grid, W.trails.length, W.trails.reduce((n, t) => n + t.pts.length, 0) >> 3].join();
  if (fsig !== V3.sig.floor) { V3.sig.floor = fsig; paintFloor(); }
  const wsig = JSON.stringify([WALLS, S.walls, S.fieldW, S.fieldH]);
  if (wsig !== V3.sig.walls) { V3.sig.walls = wsig; buildWalls3d(); }
  const rsig = JSON.stringify([DEVICES, S.robotL, S.robotW, Math.round(W.claw / 10)]);
  if (rsig !== V3.sig.robot) { V3.sig.robot = rsig; buildRobot3d(); }
  V3.robot.position.copy(v3(W.x, W.y, 0));
  V3.robot.rotation.y = -W.rot * DEG;
  // distance sensor beams
  while (V3.beams.children.length) { const c = V3.beams.children.pop(); c.geometry.dispose(); c.material.dispose(); }
  devOf("distance").forEach(d => {
    if (!plugged(d, "distance")) return;
    const m = mountWorld(d), a = m.ang * DEG, dd = Math.min(sensorRange(d), S.distanceMax);
    const geo = new T.BufferGeometry().setFromPoints([v3(m.x, m.y, 60), v3(m.x + Math.sin(a) * dd, m.y + Math.cos(a) * dd, 60)]);
    V3.beams.add(new T.Line(geo, new T.LineBasicMaterial({ color: 0xe02020, transparent: true, opacity: 0.6 })));
  });
  // camera
  const span = Math.max(S.fieldW, S.fieldH);
  let pos, look;
  if (V3.mode === "chase") {
    const a = W.rot * DEG, fx = Math.sin(a), fy = Math.cos(a);
    pos = v3(W.x - fx * 650, W.y - fy * 650, 420);
    look = v3(W.x + fx * 500, W.y + fy * 500, 40);
  } else {
    pos = new T.Vector3(0, span * 0.95, span * 0.95);
    look = new T.Vector3(0, 0, -span * 0.08);
  }
  if (!V3.cam || !RUN) V3.cam = { pos: pos.clone(), look: look.clone() };
  else { V3.cam.pos.lerp(pos, 0.15); V3.cam.look.lerp(look, 0.2); }
  V3.camera.position.copy(V3.cam.pos); V3.camera.lookAt(V3.cam.look);
  V3.renderer.render(V3.scene, V3.camera);
}
document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => setView(b.dataset.view));

/* ---- level picker ---- */
const lvlSel = document.getElementById("level");
lvlSel.innerHTML = LEVELS.map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join("");
function renderTask() {
  const l = lvl(), box = document.getElementById("task");
  lvlSel.value = LEVEL;
  box.hidden = !l.task;
  const task = LEVEL === "open" ? CUSTOM.task : l.task;
  box.hidden = !task;
  if (task) box.innerHTML = `<b>${esc(LEVEL === "open" ? "Your level" : l.name)}</b><span>${esc(task)}</span>${l.needs ? `<span class="needs">Needs: ${esc(l.needs)}</span>` : ""}`;
}
function setLevel(id, quiet) {
  stopProgram(false); if (EDIT.on) setEdit(false);
  LEVEL = id; LS.set("rfs.level", id);
  WALLS = copyWalls(id === "open" ? CUSTOM.walls : lvl().walls);
  FLOOR = copyFloor(id === "open" ? CUSTOM.floor : lvl().floor); FLOOR_VER++;
  START = id === "open" ? CUSTOM.start && CUSTOM.start.slice() : lvl().start ? lvl().start.slice() : null;
  newWorld(); if (!quiet) clearLog(); paintLeds(); renderTask(); updateWallButtons(); draw();
}
lvlSel.onchange = () => setLevel(lvlSel.value);
renderTask();

updateWallButtons(); buildLeds(); buildPad();
if (!DEVICES.length) log("Start by opening Devices and adding a Drivetrain or Motors.");
draw();
</script>
