<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Robot Field Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
/* Layout: app shell. Top bar, block editor on the left, field + readouts on the right. Single light theme on purpose: it matches the light block workspace students already know. */
:root {
  color-scheme: light;
  --bg: #e9ecf1; --panel: #ffffff; --ink: #1c2230; --muted: #5f6878; --line: #d5dae3;
  --accent: #1f6fd1; --accent-ink: #ffffff; --go: #1d9b55; --stop: #d23a2f; --chip: #f1f3f7;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; }
.app { height: 100%; display: flex; flex-direction: column; }
.bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: #1c2230; color: #fff;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar h1 { font-family: var(--display); font-size: 22px; margin: 0 12px 0 0; letter-spacing: .02em; white-space: nowrap; }
.bar h1 b { color: #5aa2ff; }
.bar .sp { flex: 1; }
.btn { font: 600 13px var(--body); border-radius: 6px; padding: 7px 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar .btn { background: #2b3446; color: #fff; border-color: #3b465c; }
.bar .btn:hover { background: #36415a; }
.btn.go { background: var(--go); color: #fff; border-color: var(--go); }
.btn.stop { background: var(--stop); color: #fff; border-color: var(--stop); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 460px); }
#blockly { min-height: 0; min-width: 0; position: relative; }
.side { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; padding: 12px; overflow: auto; min-width: 0; }
.fieldwrap { position: relative; width: 100%; aspect-ratio: 1; max-width: 100%; }
#field { width: 100%; height: 100%; display: block; border-radius: 6px; background: #8a8f98; touch-action: none; }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.controls label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.readouts { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }
.ro { background: var(--chip); border-radius: 6px; padding: 6px 8px; }
.ro .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.ro .v { font-family: var(--mono); font-size: 15px; font-variant-numeric: tabular-nums; }
.leds { display: flex; gap: 10px; flex-wrap: wrap; }
.buildbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--chip); border-radius: 8px; padding: 8px; }
.buildbar .tools { display: flex; flex-wrap: wrap; gap: 4px; }
.buildbar .tools .btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.buildbar label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.buildbar label.full { flex-basis: 100%; flex-direction: column; align-items: stretch; }
.buildbar textarea { font: inherit; font-size: 13px; resize: vertical; padding: 6px; border-radius: 6px; border: 1px solid #c9ced8; }
.led { display: flex; align-items: center; gap: 8px; background: var(--chip); border-radius: 6px; padding: 6px 10px 6px 6px; font-size: 13px; }
.led button { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #c9ced8; background: #f4f5f7; cursor: pointer; box-shadow: inset 0 -3px 0 rgba(0,0,0,.12); }
.led button:active, .led button.down { transform: scale(.94); box-shadow: inset 0 2px 3px rgba(0,0,0,.25); }
.led .hint { font-size: 11px; }
.console { background: #11161f; color: #d6f5d6; font-family: var(--mono); font-size: 12.5px; border-radius: 6px; padding: 8px 10px; min-height: 90px; max-height: 180px; overflow: auto; white-space: pre-wrap; }
.console .warn { color: #ffcf66; }
.console .err { color: #ff8a80; }
.console .ok { color: #7ee2a8; font-weight: 600; }
.builds { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0 12px; font-size: 13px; }
.builds span { color: var(--muted); margin-right: 4px; }
h2.sec { font: 600 12px var(--body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 4px 0 0; }
@media (max-width: 860px) {
  .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: 55vh auto; overflow: auto; }
  .side { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
}
/* dialogs */
[hidden] { display: none !important; }
.modal { position: fixed; inset: 0; background: rgba(15, 20, 30, .55); display: flex; align-items: center; justify-content: center; z-index: 50;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dlg { background: var(--panel); border-radius: 12px; width: min(720px, 100%); max-height: 100%; overflow: auto; display: flex; flex-direction: column; }
.dlg header { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1; }
.dlg header h2 { font-family: var(--display); font-size: 24px; margin: 0; flex: 1; }
.dlg .body { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.dlg footer { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding: 12px 18px; border-top: 1px solid var(--line); }
.devgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.dev { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--chip); cursor: pointer; text-align: left; font: inherit; color: inherit; display: flex; flex-direction: column; gap: 4px; min-height: 92px; }
.dev:hover, .dev:focus-visible { border-color: var(--accent); }
.dev .t { font-weight: 600; }
.dev .s { font-size: 12px; color: var(--muted); }
.dev .ic { width: 34px; height: 34px; }
.dev.add { border-style: dashed; background: transparent; align-items: center; justify-content: center; color: var(--accent); font-weight: 600; }
.portmap { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.pm-title { font-weight: 600; font-size: 13px; }
.pm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.pm { display: flex; gap: 8px; align-items: center; background: var(--chip); border-radius: 6px; padding: 5px 8px; font-size: 12.5px; }
.pm b { font-family: var(--mono); background: #1c2230; color: #fff; border-radius: 4px; min-width: 22px; text-align: center; padding: 1px 4px; }
.pm.bad { background: #fde8e6; color: #a52a21; }
.pm.bad i { font-style: normal; font-size: 11px; font-weight: 600; }
.pm.empty { color: var(--muted); background: transparent; border: 1px dashed var(--line); }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px 16px; }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 500; }
.form label.chk { flex-direction: row; align-items: center; gap: 8px; color: var(--ink); font-size: 14px; }
.form input[type=text], .form input[type=number], .form select { font: 14px var(--body); padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); min-width: 0; }
.form .full { grid-column: 1 / -1; }
.hint { font-size: 13px; color: var(--muted); margin: 0; max-width: 70ch; }
.err-text { color: var(--stop); font-size: 13px; }
fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 0; }
legend { font-weight: 600; padding: 0 6px; }
textarea { width: 100%; min-height: 140px; font: 12px var(--mono); border: 1px solid var(--line); border-radius: 6px; padding: 8px; box-sizing: border-box; resize: vertical; }
.pad { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
.padtop { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.padstatus { flex: 1 1 160px; font-size: 12.5px; color: var(--muted); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: #b9c0cc; flex: none; }
.dot.ok { background: var(--go); } .dot.wait { background: #f0a400; }
.padbody { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #4a5466; border-radius: 28px; padding: 10px 14px; }
.pside { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.pbtns { display: flex; gap: 6px; }
.pbtn { font: 600 12px var(--body); min-width: 40px; padding: 6px 4px; border-radius: 6px; border: 0; background: #2b3446; color: #fff; cursor: pointer; touch-action: none; }
.pbtn.on { background: var(--accent); }
.stick { width: 96px; height: 96px; border-radius: 50%; background: #2b3446; box-shadow: inset 0 3px 8px rgba(0,0,0,.4); display: grid; place-items: center; touch-action: none; cursor: grab; }
.knob { width: 44px; height: 44px; border-radius: 50%; background: #1c2230; border: 3px solid #6c7486; pointer-events: none; }
.paxes { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; color: #fff; font-family: var(--mono); font-size: 12px; }
.paxes span { color: #b9c0cc; margin-right: 4px; }
.paxes b { display: inline-block; min-width: 3.2ch; text-align: right; font-weight: 500; }
.lvl { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #c9d1de; }
.lvl select { font: 600 13px var(--body); background: #2b3446; color: #fff; border: 1px solid #3b465c; border-radius: 6px; padding: 6px 8px; }
.task { background: #eaf2fd; border: 1px solid #c4dbf7; border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
.task .needs { color: var(--muted); font-size: 12px; }
.checkrow { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.checkrow .best { font-size: 12px; color: var(--muted); }
.score { margin-top: 6px; border-radius: 6px; padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; background: #fff; border: 1px solid #c4dbf7; }
.score b { font-size: 14px; }
.score.s4 { border-color: #7fcf9f; background: #eaf8ef; }
.score.s3 { border-color: #c9d66a; background: #f7f9e6; }
.score.s0, .score.s1, .score.s2 { border-color: #f0b38a; background: #fdf1e8; }
.score.checking { color: var(--muted); }
.score .hint2 { font-size: 12.5px; }
.score .saved { font-size: 12px; color: var(--muted); }
.form1 { display: flex; flex-direction: column; gap: 10px; }
.form1 label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.form1 input, .form1 select { font: inherit; padding: 7px 8px; border: 1px solid #c9ced8; border-radius: 6px; }
.dlg.small { max-width: 420px; }
ol.steps { margin: 6px 0 10px 18px; padding: 0; font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
.led.bump button { border-radius: 6px; background: #d23a2f; border-color: #a52a21; }
.led.bump button.down { background: #8f2219; }
#field3d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; border-radius: 6px; }
.views { display: flex; gap: 0; }
.views .btn { border-radius: 0; margin-left: -1px; }
.views .btn:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
.views .btn:last-child { border-radius: 0 6px 6px 0; }
.views .btn[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); position: relative; }
.blocklyToolboxDiv { font-family: var(--body) !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.namerow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <h1>Robot <b>Field</b> Sim</h1>
    <button class="btn" id="btnDevices" type="button">Devices</button>
    <button class="btn" id="btnOpen" type="button">Open</button>
    <button class="btn" id="btnSave" type="button">Save</button>
    <button class="btn" id="btnNew" type="button">New</button>
    <input type="file" id="fileIn" accept=".vrblocks,.iqblocks,.json,.txt" hidden>
    <label class="lvl" for="level">Level <select id="level"></select></label>
    <span class="sp"></span>
    <button class="btn" id="btnSign" type="button" hidden>Sign in</button>
    <button class="btn" id="btnTeacher" type="button">Teacher settings</button>
  </div>
  <div class="main">
    <div id="blockly"></div>
    <aside class="side">
      <div class="controls">
        <button class="btn go" id="btnRun" type="button">▶ Start</button>
        <button class="btn stop" id="btnStop" type="button">■ Stop</button>
        <button class="btn" id="btnReset" type="button">↺ Reset</button>
        <label for="speed">Speed
          <select id="speed"><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
        </label>
        <label for="showPath"><input type="checkbox" id="showPath" checked> Path</label>
      </div>
      <div class="task" id="task" hidden></div>
      <div class="views" role="group" aria-label="Camera view">
        <button class="btn" type="button" data-view="top" aria-pressed="true">Top</button>
        <button class="btn" type="button" data-view="chase" aria-pressed="false">Behind robot</button>
        <button class="btn" type="button" data-view="field3d" aria-pressed="false">3D field</button>
      </div>
      <div class="fieldwrap"><canvas id="field" aria-label="Field view"></canvas><canvas id="field3d" hidden aria-label="3D field view"></canvas></div>
      <div class="controls">
        <button class="btn" id="btnWalls" type="button">Edit field</button>
        <button class="btn" id="btnDelWall" type="button" hidden>Delete</button>
        <button class="btn" id="btnClearWalls" type="button" hidden>Clear field</button>
        <button class="btn" id="btnShareLevel" type="button" hidden>Share level</button>
        <button class="btn" id="btnLoadLevel" type="button" hidden>Load level code</button>
        <button class="btn" id="btnCopyLevel" type="button" hidden>Copy to Build your own</button>
      </div>
      <div class="buildbar" id="buildBar" hidden>
        <div class="tools" role="group" aria-label="Build tool">
          <button class="btn" type="button" data-tool="wall">Wall</button>
          <button class="btn" type="button" data-tool="block">Block</button>
          <button class="btn" type="button" data-tool="tile">Color tile</button>
          <button class="btn" type="button" data-tool="tape">Tape line</button>
          <button class="btn" type="button" data-tool="cube">Cube</button>
          <button class="btn" type="button" data-tool="start">Robot start</button>
        </div>
        <label id="bColorL">Color <select id="bColor"><option value="red">red</option><option value="green">green</option><option value="blue">blue</option><option value="yellow">yellow</option><option value="black">black</option></select></label>
        <label id="bHeadL">Facing <select id="bHead"><option value="0">up (0°)</option><option value="90">right (90°)</option><option value="180">down (180°)</option><option value="270">left (270°)</option></select></label>
        <label id="bTaskL" class="full">Task for students <textarea id="bTask" rows="2" maxlength="600" placeholder="Example: Drive to the green tile without touching a wall."></textarea></label>
      </div>
      <p class="hint" id="wallTip" hidden></p>
      <h2 class="sec">Robot</h2>
      <div class="readouts" id="readouts"></div>
      <div class="leds" id="leds"></div>
      <div class="pad" id="pad" hidden aria-label="Controller"></div>
      <h2 class="sec">Print console</h2>
      <div class="console" id="console" aria-live="polite"></div>
    </aside>
  </div>
</div>

<div class="modal" id="mDevices" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="devTitle">
    <header><h2 id="devTitle">Devices</h2><button class="btn" type="button" data-close>Done</button></header>
    <div class="body" id="devBody"></div>
  </div>
</div>
<div class="modal" id="mTeacher" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="tTitle">
    <header><h2 id="tTitle">Teacher settings</h2><button class="btn" type="button" data-close>Cancel</button></header>
    <div class="body" id="tBody"></div>
    <footer>
      <button class="btn" type="button" id="tDefaults">Restore defaults</button>
      <button class="btn" type="button" id="tExport">Copy settings code</button>
      <button class="btn" type="button" id="tImport">Paste settings code</button>
      <button class="btn primary" type="button" id="tSave">Save settings</button>
    </footer>
  </div>
</div>
<div class="modal" id="mSign" hidden>
  <div class="dlg small" role="dialog" aria-modal="true" aria-labelledby="sTitle">
    <header><h2 id="sTitle">Sign in to your class</h2><button class="btn" type="button" data-close>Close</button></header>
    <div class="body" id="signBody"></div>
    <footer id="signFoot"></footer>
  </div>
</div>
<div class="modal" id="mText" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="xTitle">
    <header><h2 id="xTitle">Save project</h2><button class="btn" type="button" data-close>Close</button></header>
    <div class="body"><p class="hint" id="xHint"></p><div class="form1 namerow" id="xNames" hidden><label>Last name<input id="xLast" autocomplete="family-name"></label><label>First name<input id="xFirst" autocomplete="given-name"></label></div><textarea id="xText" aria-label="Project text"></textarea><div class="err-text" id="xErr"></div></div>
    <footer><button class="btn" type="button" id="xDownload" hidden>Download file</button><button class="btn" type="button" id="xAction" hidden>Load</button><button class="btn primary" type="button" id="xCopy">Copy</button></footer>
  </div>
</div>

<script src="https://unpkg.com/blockly@10.4.3/blockly.min.js"></script>
<script>
"use strict";
/* =====================================================================
   Settings (teacher) and device configuration (student)
   Robot kit: VEX IQ Gen 2 Brain (with its built-in gyro) and first generation (Gen 1) motors and sensors.
   ===================================================================== */
const KIT = {
  name: "VEX IQ (Gen 2 Brain, Gen 1 devices)", ports: 12, motorRPM: 120, wheelTravel: 200, track: 176, wheelbase: 156,
  wheels: [["160 mm wheel", 160], ["200 mm wheel", 200], ["250 mm wheel", 250]],
};
const PORT_ROLES = [   // the real robot's ports (teacher sets these)
  ["left", "Left drive motor"], ["right", "Right drive motor"], ["arm", "Arm motor"], ["claw", "Claw motor"],
  ["gyro", "Gyro sensor"], ["distance", "Distance sensor"], ["color", "Color sensor"], ["touchled", "Touch LED"], ["bumper", "Bumper switch"],
  ["bumper2", "Bumper switch 2"], ["bumper3", "Bumper switch 3"], ["touchled2", "Touch LED 2"],
];
// a sensor type can sit on its main port or on its numbered extra ports (bumper, bumper2, bumper3)
const roleKeys = role => [role, role + "2", role + "3"].filter(k => k in S.ports);
const onRolePort = (port, role) => roleKeys(role).some(k => S.ports[k] && S.ports[k] === port);
function defaultSettings() {
  return {
    version: 2, fieldW: 2000, fieldH: 2000, walls: true, grid: 250,
    startX: 0, startY: 0, startH: 0,
    robotL: 230, robotW: 200,
    wheelTravel: KIT.wheelTravel, track: KIT.track, gear: 1, motorRPM: KIT.motorRPM,
    rightMirrored: true, checkPorts: true, showPortMap: true, allowPosition: true, hideRepeatUntil: false,
    ports: { left: 1, right: 6, arm: 10, claw: 4, gyro: 5, distance: 7, color: 3, touchled: 2, bumper: 8, bumper2: 9, bumper3: 11, touchled2: 12 },
    distanceMax: 1000,
  };
}
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
function loadSettings(saved) {
  const d = defaultSettings();
  if (!saved || saved.version !== 2) return d;           // older saves used other kits; start fresh
  const s = Object.assign(d, saved); s.ports = Object.assign(defaultSettings().ports, saved.ports || {}); return s;
}
let S = loadSettings(LS.get("rfs.settings", null));
const KNOWN_TYPES = ["drivetrain", "motor", "gyro", "distance", "color", "touchled", "bumper", "controller"];
let DEVICES = LS.get("rfs.devices", []).filter(d => KNOWN_TYPES.includes(d.type));

const DEVICE_TYPES = {
  drivetrain: { label: "Drivetrain 2-motor", sub: "Two drive motors", base: "Drivetrain" },
  motor: { label: "Motor", sub: "One Smart Motor", base: "Motor" },
  gyro: { label: "Gyro sensor", sub: "Heading and rotation", base: "Gyro" },
  distance: { label: "Distance sensor", sub: "Gen 1 ultrasonic", base: "Distance" },
  color: { label: "Color sensor", sub: "Color and brightness", base: "Color" },
  touchled: { label: "Touch LED", sub: "Light you can press", base: "TouchLED" },
  bumper: { label: "Bumper switch", sub: "Pressed or not", base: "Bumper" },
  controller: { label: "Controller", sub: "IQ Controller", base: "Controller" },
};
const devOf = t => DEVICES.filter(d => d.type === t);
const drivetrain = () => DEVICES.find(d => d.type === "drivetrain");
const devByName = (t, n) => devOf(t).find(d => d.name === n) || null;

/* Device blocks: the first field is a dropdown of the student's devices of that type.
   parts: list of items, each a string (label), ["value", NAME, check?] or ["dd", NAME, options]. */
function deviceMenu(type) {
  return function () {
    const list = devOf(type).map(d => [d.name, d.name]);
    return list.length ? list : [["(add in Devices)", "__none"]];
  };
}
function defDev(type, devType, colour, parts, shape) {
  Blockly.Blocks[type] = {
    init() {
      let inp = this.appendDummyInput("D0");
      let devPlaced = false, k = 0;
      for (const p of parts) {
        if (p === "@") { inp.appendField(new Blockly.FieldDropdown(deviceMenu(devType)), "DEVICE"); devPlaced = true; }
        else if (typeof p === "string") inp.appendField(p);
        else if (p[0] === "dd") inp.appendField(new Blockly.FieldDropdown(p[2]), p[1]);
        else if (p[0] === "value") { this.appendValueInput(p[1]).setCheck(p[2] || null); inp = this.appendDummyInput("D" + (++k)); }
      }
      if (!devPlaced) this.getInput("D0").insertFieldAt(0, new Blockly.FieldDropdown(deviceMenu(devType)), "DEVICE");
      this.setInputsInline(true);
      this.setColour(colour);
      if (shape === "stmt") { this.setPreviousStatement(true); this.setNextStatement(true); }
      else this.setOutput(true, shape);
    },
  };
}

function stadium(cx, cy, half, r, step) {   // a running-track shaped loop, as points
  const pts = [];

  for (let a = 90; a <= 270; a += step) pts.push([cx - half + r * Math.cos(a * Math.PI / 180), cy + r * Math.sin(a * Math.PI / 180)]);
  pts.push(pts[0]);

}

    btn.addEventListener("pointerdown", e => { e.preventDefault(); btn.setPointerCapture(e.pointerId); set(true); });
    btn.addEventListener("pointerup", () => set(false));
    btn.addEventListener("pointercancel", () => set(false));

function renderPicker() {

    const realFree = r => r && !used.has(r) ? (used.add(r), r) : 0;

    else {
      // start on the real robot's port when it's free (motors: drive, arm, then claw ports)
      const p = t === "motor" ? (["left", "right", "arm", "claw"].map(k => S.ports[k]).find(r => r && !used.has(r) && used.add(r)) || free())

    if (d.type === "color") f += `<label>Sensor points<select id="fFacing"><option value="down" ${d.facing === "down" ? "selected" : ""}>Down at the field</option><option value="forward" ${d.facing === "forward" ? "selected" : ""}>Out from the robot</option></select></label>`;
    if (["distance", "color", "bumper"].includes(d.type)) f += `
      <label>Mounted on<select id="fMount">${MOUNTS.map(([v, n]) => `<option value="${v}" ${(d.mount || "front") === v ? "selected" : ""}>${n}</option>`).join("")}</select></label>
      <label>Shift along that side (mm)<input type="number" id="fOffset" step="5" value="${+d.offset || 0}"></label>
      <p class="hint full">The sensor faces straight out from the side it is on. Shift moves it along that side: on the front or back, + is toward the robot's right; on a side, + is toward the front. The field shows where it sits.</p>`;
  }
  devBody.innerHTML = `<fieldset><legend>${ICONS[d.type].replace('class="ic"', 'class="ic" style="vertical-align:middle;width:24px;height:24px"')} ${DEVICE_TYPES[d.type].label}</legend><div class="form">${f}</div></fieldset>
    <div class="err-text" id="fErr"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn primary" type="button" id="fOk">Done</button>

    </div>`;
  document.getElementById("fCancel").onclick = () => { editing = null; renderDevices(); };
  if (editing.orig) document.getElementById("fDel").onclick = () => {

    if (gone.type === "gyro") DEVICES.forEach(x => { if (x.type === "drivetrain" && x.gyro === gone.name) x.gyro = ""; });

    const g = id => document.getElementById(id);

    if (d.type === "controller") {

    }
    if (DEVICES.some(x => x !== editing.orig && x.name === nd.name)) { g("fErr").textContent = "Another device already has that name."; return; }
    if (editing.orig) {
      if (d.type === "motor" && editing.orig.name !== nd.name) DEVICES.forEach(x => { if (x.type === "controller") for (const k in x.buttons || {}) if (x.buttons[k] === editing.orig.name) x.buttons[k] = nd.name; });
      if (d.type === "gyro" && editing.orig.name !== nd.name) DEVICES.forEach(x => { if (x.type === "drivetrain" && x.gyro === editing.orig.name) x.gyro = nd.name; });
      DEVICES[DEVICES.indexOf(editing.orig)] = nd;
    } else DEVICES.push(nd);

  };

async function downloadText(name, text) {

    if (!d) return "blocked";
    try { await d.save({ filename: name + ".json", data: text }); return "renamed"; }
    catch (e) { return e && e.code === "declined" ? "declined" : "blocked"; }

/* =====================================================================
   Controller: on-screen pad, keyboard, USB game controller, and the real
   VEX IQ controller relayed by the Brain over USB (Web Serial).
   Axes A-D read -100..100 like VEXcode: A = left stick up/down, B = left stick
   left/right, C = right stick left/right, D = right stick up/down.

const DRIVE_MODES = [["none", "None (I'll program it)"], ["tank", "Tank drive (A and D)"], ["left_arcade", "Left arcade (A and B)"],
  ["right_arcade", "Right arcade (D and C)"], ["split_arcade", "Split arcade (A and C)"]];
const BTN_KEYS = BUTTONS.map(b => b[1]);

const KEYS = new Set();
const KEYMAP = { KeyW: ["A", 100], KeyS: ["A", -100], KeyA: ["B", -100], KeyD: ["B", 100],
  ArrowUp: ["D", 100], ArrowDown: ["D", -100], ArrowLeft: ["C", -100], ArrowRight: ["C", 100] };

function readCtrl() {
  const axes = zeroAxes(), btn = zeroBtns(), srcs = new Set();
  const take = (a, v, src) => { v = Math.round(Math.max(-100, Math.min(100, v))); if (Math.abs(v) > Math.abs(axes[a])) axes[a] = v; if (v) srcs.add(src); };
  const press = (k, on, src) => { if (on) { btn[k] = true; srcs.add(src); } };
  for (const a in SCREEN.axes) take(a, SCREEN.axes[a], "screen");
  for (const k of BTN_KEYS) press(k, SCREEN.btn[k], "screen");
  for (const c of KEYS) { if (KEYMAP[c]) take(KEYMAP[c][0], KEYMAP[c][1], "keys"); if (KEYBTN[c]) press(KEYBTN[c], true, "keys"); }
  if (performance.now() - SER.t < 300) {
    for (const a in SER.axes) take(a, SER.axes[a], "brain");
    for (const k of BTN_KEYS) press(k, SER.btn[k], "brain");

  const pads = navigator.getGamepads ? Array.from(navigator.getGamepads()).filter(Boolean) : [];
  for (const gp of pads) {
    const ax = i => { const v = gp.axes[i] || 0; return Math.abs(v) < 0.08 ? 0 : v * 100; };
    take("A", -ax(1), "gamepad"); take("B", ax(0), "gamepad"); take("C", ax(2), "gamepad"); take("D", -ax(3), "gamepad");
    for (const k of BTN_KEYS) { const b = gp.buttons[PAD_BTN[k]]; press(k, !!b && (b.pressed || b.value > 0.5), "gamepad"); }

/* runs once per physics tick while a program runs */
function controllerTick() {
  readCtrl();

  const cur = { axes: { ...CTRL.axes }, btn: { ...CTRL.btn } }, prev = RUN.prevCtrl;
  RUN.prevCtrl = cur;
  if (prev) for (const h of RUN.hats) {
    let fire;
    if (h.type === "iq_controller_when_button") {
      const k = h.getFieldValue("BUTTON"), want = h.getFieldValue("ACTION") === "pressed";
      fire = cur.btn[k] === want && prev.btn[k] !== want;

    if (!fire) continue;
    const running = RUN.hatRuns.get(h.id);
    if (running && RUN.scripts.includes(running)) continue;   // still busy from last time

  const cd = controllerDev(), dt = drivetrain(), a = CTRL.axes;

      const [fwd, turn] = cd.drive === "left_arcade" ? [a.A, a.B] : cd.drive === "right_arcade" ? [a.D, a.C] : [a.A, a.C];
      L = fwd + turn; R = fwd - turn;

function releaseActions() {

  Object.values(W.motors).forEach(st => { if (st.ctrl) { st.mode = "idle"; st.ctrl = false; } });

const typingTarget = el => !!el && (/INPUT|TEXTAREA|SELECT/.test(el.tagName) || el.isContentEditable);

/* ---- real controller through the Brain (Web Serial) ---- */
const BRAIN_PROGRAM = `# Robot Field Sim controller link
# In VEXcode IQ: start a new Python project, replace everything with this,
# then download it to the Brain. Keep the Brain plugged in with USB.
from vex import *

brain = Brain()
controller = Controller()

def b(button):
    return "1" if button.pressing() else "0"

while True:
    buttons = (b(controller.buttonEUp) + b(controller.buttonEDown) +
               b(controller.buttonFUp) + b(controller.buttonFDown) +
               b(controller.buttonLUp) + b(controller.buttonLDown) +
               b(controller.buttonRUp) + b(controller.buttonRDown))
    print("C,%d,%d,%d,%d,%s" % (controller.axisA.position(), controller.axisB.position(),
                                controller.axisC.position(), controller.axisD.position(), buttons))
    wait(40, MSEC)
`;
const LINE_RE = /C,(-?\d+),(-?\d+),(-?\d+),(-?\d+),([01]{8})/;
function parseBrainLine(line) {
  SER.lines++;
  const m = LINE_RE.exec(line);
  if (!m) return false;
  SER.axes = { A: +m[1], B: +m[2], C: +m[3], D: +m[4] };
  BTN_KEYS.forEach((k, i) => SER.btn[k] = m[5][i] === "1");
  SER.t = performance.now();
  return true;
}
let padNote = "";
async function connectBrain() {
  if (!navigator.serial) {
    padNote = "This browser can't talk to the Brain. Open the simulator from the class website in Chrome or Edge on a computer.";
    return;
  }
  let port;
  try { port = await navigator.serial.requestPort({ filters: [{ usbVendorId: 0x2888 }] }); }
  catch (e) {
    if (e.name !== "NotFoundError") padNote = e.name === "SecurityError"
      ? "USB isn't allowed on this copy of the page. Open the simulator from the class website (stopper122.github.io/robotics) in Chrome or Edge."
      : "Couldn't connect: " + e.message;
    return;
  }
  try { await port.open({ baudRate: 115200 }); }
  catch (e) { padNote = "Couldn't open that port. Close VEXcode (it may be using the Brain) and try again."; return; }
  SER.ports.push(port); SER.opened = performance.now(); padNote = "";
  const dec = new TextDecoder();
  let buf = "";
  try {
    while (port.readable) {
      const reader = port.readable.getReader();
      try {
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const parts = buf.split(/\r?\n/); buf = parts.pop();
          if (buf.length > 400) buf = "";
          parts.forEach(parseBrainLine);
        }
      } finally { reader.releaseLock(); }
    }
  } catch (e) { /* unplugged */ }
  SER.ports = SER.ports.filter(p => p !== port);
  try { await port.close(); } catch (e) {}
  padNote = "The Brain was disconnected.";
}
function brainStatus() {
  const now = performance.now();
  if (now - SER.t < 300) return ["ok", "Real controller connected through the Brain"];
  if (SER.ports.length) {
    if (now - SER.opened < 2500) return ["wait", "Brain connected. Waiting for controller data..."];
    if (SER.lines) return ["wait", "The Brain is sending, but not controller data. Run the Brain program (see How?)."];
    return ["wait", "Brain connected, but no data. Run the Brain program, or click Connect again and pick the other VEX port."];
  }
  return ["off", padNote || "Using the on-screen controller and keyboard"];
}

async function findCheck() {

  for (const a of [120, 250]) {
    FORCE_ANGLE = a;
    const st = await testRun({ secs: 25, settle: 0.5 });
    FORCE_ANGLE = null;
    if (st.noProgram) return nothing(st);
    moved = Math.max(moved, st.moved);
    const c = W.cubes[0], shift = Math.hypot(c.x - 450 * Math.sin(a * DEG), c.y - 450 * Math.cos(a * DEG));

  if (moved < 20) return result(0, "The robot did not move.", 'Put your blocks under "when started".');

  if (good === 2) return result(4, said);

async function linesCheck() {
  let crossed = 0, onPrev = false;
  const st = await testRun({ secs: 25, settle: 0.5, each: () => {
    const c = downColor(); if (!c) return;
    const p = mountWorld(c), on = floorAt(p.x, p.y) === "black";
    if (on && !onPrev) crossed++; onPrev = on;

  if (st.moved < 20) return nothing(st);

  if (Math.abs(p.y - COUNT_LINES[2]) <= 110) return result(3, "The robot stopped close to the 3rd line but not on it.", "Stop driving as soon as you count the 3rd line, before waiting for white.");
  if (idx >= 0) return result(2, `The robot stopped on line ${idx + 1} instead of line 3.`, idx < 2 ? "It counted a line more than once. After adding 1, wait until the sensor sees white (bright) again before checking for the next line." : "It counted too few lines. Add 1 every time the sensor goes from white to dark, and stop when the count equals 3.");

}
async function sumoCheck() {

    : result(1, "The robot drove out of the ring.", "Check the Color sensor while you drive: when the brightness is low (dark), back up and turn.");
  if (path < 1000) return result(2, "The robot stayed in the ring but hardly moved around.", "Keep driving forward between edges so the robot crosses the ring.");
  if (st.lastMoveT < 17) return result(3, "The robot stayed in the ring but stopped moving before the 20 seconds were up.", "Put your drive and edge check in a forever loop so the robot keeps going.");
  if (bounces < 3) return result(3, `The robot stayed in the ring but only reached the edge ${bounces} time${bounces === 1 ? "" : "s"}.`, "Drive forward until you see the edge, then back up and turn. Repeat it in a forever loop.");

}
async function stairCheck() {
  const corners = STAIR_PATH.slice(1, -1); let reached = 0;
  const st = await testRun({ secs: 60, settle: 1, each: () => { if (reached < corners.length && Math.hypot(W.x - corners[reached][0], W.y - corners[reached][1]) < 150) reached++; } });

  const all = ws.getAllBlocks(false).filter(b => b.isEnabled());
  const defs = all.filter(b => b.type === "procedures_defnoreturn" && b.getInputTargetBlock("STACK"));
  const calls = all.filter(b => b.type === "procedures_callnoreturn" && defs.some(d => d.getFieldValue("NAME") === b.getFieldValue("NAME")));
  const inLoop = calls.some(b => { for (let p = b.getSurroundParent(); p; p = p.getSurroundParent()) if (/repeat|forever|while/.test(p.type)) return true; return false; });

}
async function lineCheck(tricky) {
  const line = lvl().floor[0].line, bins = new Set();
  let on = 0, n = 0, total = 1;
  const st = await testRun({ secs: tricky ? 150 : 90, settle: 1, each: () => {
    const c = downColor(); if (!c) return;
    const p = mountWorld(c), r = nearestOnLine(line, p.x, p.y); total = r.total; n++;
    if (r.d < 40) { on++; bins.add(Math.min(49, Math.floor(r.s / r.total * 50))); }
  } });
  if (!downColor()) return result(st.moved > 20 ? 1 : 0, "There is no Color sensor pointing down.", "Add a Color sensor in Devices and set it to point down at the field.");
  if (st.moved < 20) return nothing(st);
  const cov = bins.size / 50, pct = Math.round(cov * 100);
  const g = lvl().floor[1] && lvl().floor[1].rect, c = downColor(), p = mountWorld(c);
  const finished = tricky && st.still && floorReading(p.x, p.y).name === "green";   // what the sensor itself sees
  const hint = "Follow one edge of the line: when the sensor sees dark, turn one way; when it sees bright, turn the other way. Go slower if the robot loses the line on curves.";
  if (tricky) {
    if (finished && cov >= 0.8) return result(4, `The robot followed ${pct}% of the line and stopped on green.`);
    if (finished || cov >= 0.7) return result(3, finished ? "The robot stopped on green but skipped parts of the line." : `The robot followed ${pct}% of the line but didn't stop on green.`, finished ? hint : 'Use "repeat until Color detects green" around your line following, then stop.');
    return result(cov >= 0.3 ? 2 : 1, `The robot followed ${pct}% of the line.`, hint);
  }

}
async function mazeCheck(path) {
  const corners = path.slice(1, -1); let reached = 0;
  const st = await testRun({ secs: 150, settle: 1, each: () => { if (reached < corners.length && Math.hypot(W.x - corners[reached][0], W.y - corners[reached][1]) < 150) reached++; } });
  if (st.moved < 20) return nothing(st);
  const fin = FLOOR.find(f => f.color === "yellow").rect, inFin = (x, y) => x >= fin[0] - 60 && x <= fin[0] + fin[2] + 60 && y >= fin[1] - 60 && y <= fin[1] + fin[3] + 60;

async function remoteCheck(back, leds) {
  const bumpers = devOf("bumper"), need = back ? 3 : 2;

  for (const order of perms(names).filter((p, i, a) => a.findIndex(q => q.slice(0, need).join() === p.slice(0, need).join()) === i)) {
    const role = { L: order[0], R: order[1], B: order[2] };

      const t0 = i * 1.5;
      events.push({ t: t0, fn: () => { names.forEach(n => W.bumps[n] = false); keys.forEach(k => W.bumps[role[k]] = true); } });
      events.push({ t: t0 + 0.5, fn: () => { meas[i] = { x: W.x, y: W.y, rot: W.rot, wl: 0, wr: 0 }; } });

/* ---- the Check my work button and the score card ---- */
const SCORES = LS.get("rfs.scores", {});   // best score per level in this browser
async function checkWork() {
  const fn = CHECKS[LEVEL]; if (!fn || CHECKING) return;
  if (EDIT.on) setEdit(false);
  stopProgram(false); clearLog();
  CHECKING = true; renderTask();
  let r;
  const lvAt = LEVEL;
  try { r = await fn(); }
  catch (e) { console.error(e); r = result(0, "The check could not finish: " + e.message, "Try running your program first to look for errors."); }
  finally { if (LEVEL === lvAt) CHECKING = false; FORCE_COLORS = null; FORCE_ANGLE = null; }
  if (LEVEL !== lvAt) return;   // the level was changed while checking
  const prev = SCORES[LEVEL];
  SCORES[LEVEL] = { best: Math.max(r.score, prev ? prev.best : 0), last: r.score, at: Date.now() };
  LS.set("rfs.scores", SCORES);
  CHECK_RESULT = { level: LEVEL, ...r };
  renderTask(); draw();
  if (typeof reportScore === "function") reportScore(LEVEL, r);
}
var CHECK_RESULT = null;
function scoreCardHTML() {
  if (!CHECKS[LEVEL]) return "";

  const r = CHECK_RESULT && CHECK_RESULT.level === LEVEL ? CHECK_RESULT : null, best = SCORES[LEVEL];
  let h = `<div class="checkrow"><button class="btn primary" type="button" id="btnCheck">Check my work</button>${best ? `<span class="best">Best: ${best.best} / 4</span>` : ""}</div>`;
  if (r) h += `<div class="score s${r.score}"><b>Score: ${r.score} / 4</b><span>${esc(r.said)}</span>${r.hint ? `<span class="hint2">Hint: ${esc(r.hint)}</span>` : ""}${r.saved ? `<span class="saved">${esc(r.saved)}</span>` : ""}</div>`;
  return h;
}
